[workspace]
resolver = "2"
members = [
    "crates/fracture-core",
    "crates/fracture-engine",
    "crates/fracture-generate",
    "crates/fracture-server",
    "crates/fracture-gguf",
    "backends/fracture-cuda",
    "bins/fracture-server-cuda",
    "tests/validation",
    "tests/model-validation",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/nickw409/Fracture"

[workspace.dependencies]
fracture-core = { path = "crates/fracture-core" }
fracture-engine = { path = "crates/fracture-engine" }
fracture-generate = { path = "crates/fracture-generate" }
fracture-server = { path = "crates/fracture-server" }
fracture-gguf = { path = "crates/fracture-gguf" }
fracture-cuda = { path = "backends/fracture-cuda" }
fracture-validation = { path = "tests/validation" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Tokenizer
tokenizers = "0.21"

# Misc
byteorder = "1"
memmap2 = "0.9"
half = { version = "2", features = ["serde"] }
rand = "0.9"
async-stream = "0.3"
futures-core = "0.3"
tempfile = "3"
http-body-util = "0.1"
