project: Fracture
description: |
  Cross-platform GPU-accelerated LLM inference server in Rust with pluggable backends.
  Phase 1: single-node inference for Llama 3 8B via GGUF, served over OpenAI-compatible HTTP API.
  CUDA backend initially; engine is backend-agnostic via the Backend trait to support Metal in Phase 5+.
  Testing validates correctness at every layer from individual GPU kernels through end-to-end generation.

shared:
  - name: numerical-correctness
    description: |
      All tensor-producing operations must match PyTorch reference outputs within FP16 tolerance
      (rtol=1e-3, atol=1e-3). Reference tensors are generated by scripts/dump_reference.py and
      stored in tests/reference/. Tests load reference tensors, run the Fracture implementation
      on identical inputs, and assert element-wise closeness. Any test that produces or transforms
      tensors must validate against this reference.

  - name: error-handling
    description: |
      All fallible operations return typed errors via Result. Errors propagate with context
      (which layer, which kernel, which tensor). Backend errors (CUDA status, Metal errors) are
      mapped to Rust error types in the backend crate, never exposed to the engine. No panics in
      library crates. Panics are acceptable only in the server binary entry point for unrecoverable
      startup failures.

  - name: backend-agnostic
    description: |
      The engine, generation loop, server, and protocol crates never import or depend on any
      backend crate (fracture-cuda, fracture-metal). All GPU operations go through the Backend
      trait defined in fracture-core. DeviceTensor is an opaque handle — the engine never
      dereferences device pointers. Only the final binary in bins/ selects and instantiates
      a concrete backend.

sections:
  # ============================================================
  # CORE TYPES AND BACKEND TRAIT
  # ============================================================
  - name: Core Types
    path: crates/fracture-core/src
    description: |
      Shared types used by all crates: DeviceTensor, Backend trait, ModelConfig,
      DType, error types. This crate defines the contract between the engine and
      any GPU backend.
    shared: [error-handling, backend-agnostic]
    behaviors:
      - name: device-tensor-opaque
        description: |
          DeviceTensor contains a TensorId (opaque u64), shape (Vec<usize>), and
          dtype (DType enum). It does NOT contain device pointers, CUDA types, or
          Metal types. The engine can inspect shape and dtype but cannot access
          device memory directly.

      - name: backend-trait-completeness
        description: |
          The Backend trait defines all operations the engine needs: alloc, free,
          copy_to_device, copy_to_host, matmul, rmsnorm, rope, attention, silu_mul,
          embedding, add, copy_slice, device_name, total_memory, available_memory.
          The engine can execute a full transformer forward pass using only these methods.
          No operation requires backend-specific imports.

      - name: model-config-validation
        description: |
          ModelConfig validates required fields: hidden_size, num_layers,
          num_q_heads, num_kv_heads, head_dim, intermediate_size, vocab_size,
          rope_theta, rms_norm_eps. Derived values are consistent
          (head_dim == hidden_size / num_q_heads). Errors on missing or
          inconsistent values.

      - name: dtype-support
        description: |
          DType enum covers FP16, FP32, BF16, INT8, INT4. Size-in-bytes
          calculation is correct for each variant. DType is used in DeviceTensor
          metadata and tensor serialization.

sections:
  # ============================================================
  # GGUF PARSER AND WEIGHT LOADING
  # ============================================================
  - name: GGUF Parser
    path: crates/fracture-gguf/src
    description: |
      Parses GGUF binary files and loads model weights to GPU memory.
      Must handle the GGUF v3 format including metadata, tensor info table,
      and tensor data with correct alignment.
    shared: [error-handling]
    behaviors:
      - name: header-parsing
        description: |
          Reads GGUF magic number (0x46475547) and version. Rejects files with
          wrong magic number. Rejects unsupported versions (only v3 supported).
          Extracts tensor count and metadata KV count from header.

      - name: metadata-extraction
        description: |
          Parses metadata key-value pairs from the GGUF file. Extracts model
          architecture config: hidden_size, num_layers, num_attention_heads,
          num_kv_heads, intermediate_size, vocab_size, rope_theta, rms_norm_eps.
          Returns typed ModelConfig struct. Errors on missing required keys.

      - name: tensor-info-parsing
        description: |
          Parses the tensor info table. Extracts tensor name, shape, data type,
          and byte offset for each tensor. Validates that expected tensors exist
          for the Llama architecture (embedding, per-layer Q/K/V/O/gate/up/down/norms,
          output norm, LM head). Errors on missing required tensors.

      - name: weight-loading
        description: |
          Memory-maps the GGUF file and copies tensor data to GPU memory.
          Respects alignment requirements (256-byte aligned GPU allocations).
          Handles FP16 tensor data type. Validates tensor byte sizes match
          expected shape × dtype size. Returns WeightStore with all tensors
          on GPU. Errors on size mismatches or GPU allocation failures.

      - name: weight-naming
        description: |
          Maps GGUF tensor names (token_embd.weight, blk.{i}.attn_q.weight, etc.)
          to the LayerWeights struct fields. Handles all Llama 3 weight names.
          Ignores unknown tensor names with a warning rather than failing.

  # ============================================================
  # CUDA KERNELS
  # ============================================================
  - name: RMSNorm Kernel
    path: backends/fracture-cuda
    description: |
      CUDA implementation of the Backend::rmsnorm method. Root Mean Square
      Layer Normalization applied before attention and FFN sublayers.
      A Metal backend would implement the same operation independently.
    shared: [numerical-correctness, error-handling]
    behaviors:
      - name: rmsnorm-forward
        description: |
          Computes RMSNorm: output = (x / sqrt(mean(x^2) + eps)) * weight.
          Input x is [N, 4096], weight is [4096], eps is 1e-5.
          Sum-of-squares accumulation uses FP32 to prevent precision loss.
          Output is FP16. Must match PyTorch reference for N=1 (decode)
          and N>1 (prefill, e.g. N=128, N=512).

      - name: rmsnorm-numerical-stability
        description: |
          Handles edge cases: all-zero input (should produce all-zero output),
          very large input values (no overflow in FP32 accumulator),
          very small input values (eps prevents division by zero).

  - name: RoPE Kernel
    path: backends/fracture-cuda
    description: |
      CUDA implementation of the Backend::rope method. Rotary Positional
      Embeddings applied to Q and K tensors after projection, before attention.
    shared: [numerical-correctness, error-handling]
    behaviors:
      - name: rope-precomputation
        description: |
          Pre-computes sin/cos frequency table on initialization for all
          positions up to max_seq_len. Uses base theta=500000.
          Frequency for dimension pair i: theta^(-2i/d_head) where d_head=128.
          Table stored on GPU, reused across all layers and forward passes.

      - name: rope-apply
        description: |
          Applies rotary embedding to Q [N, 32, 128] and K [N, 8, 128] tensors.
          Rotates pairs of adjacent dimensions using pre-computed sin/cos values
          at the given sequence positions. Must handle non-contiguous positions
          (e.g. positions=[47] during decode at step 47). Must match PyTorch
          reference for both prefill (many positions) and decode (single position).

  - name: SiLU Multiply Kernel
    path: backends/fracture-cuda
    description: |
      CUDA implementation of the Backend::silu_mul method. Fused SiLU activation
      and elementwise multiplication used in SwiGLU FFN.
    shared: [numerical-correctness, error-handling]
    behaviors:
      - name: silu-mul-forward
        description: |
          Computes silu(gate) * up where silu(x) = x * sigmoid(x).
          Both gate and up are [N, 14336]. Output is [N, 14336].
          Fused into a single kernel (no intermediate materialization).
          Must match PyTorch reference for N=1 and N>1.

  - name: Attention Kernel
    path: backends/fracture-cuda
    description: |
      CUDA implementation of the Backend::attention method. Scaled dot-product
      attention with causal masking and GQA. The most complex kernel in any backend.
    shared: [numerical-correctness, error-handling]
    behaviors:
      - name: attention-prefill
        description: |
          Computes causal self-attention during prefill. Q is [N, 32, 128],
          K_cache and V_cache are [N, 8, 128] (no prior cache, all new).
          Applies causal mask so position i only attends to positions 0..i.
          Each group of 4 Q heads shares 1 KV head (GQA with group size 4).
          Softmax computed in FP32 for numerical stability.
          Output is [N, 32, 128]. Must match PyTorch reference.

      - name: attention-decode
        description: |
          Computes attention during decode. Q is [1, 32, 128] (single new token).
          K_cache and V_cache are [seq_len, 8, 128] (all prior tokens + current).
          No causal mask needed (single query naturally attends to all keys).
          GQA head expansion applies. Output is [1, 32, 128].
          Must match PyTorch reference for various cache lengths.

      - name: attention-gqa-correctness
        description: |
          Validates that GQA head sharing is correct: Q heads 0-3 share KV head 0,
          Q heads 4-7 share KV head 1, etc. Compare against explicit per-head
          computation to ensure grouping produces identical results.

  - name: Embedding Lookup
    path: backends/fracture-cuda
    description: |
      CUDA implementation of the Backend::embedding method. Token ID to
      embedding vector lookup on device.
    shared: [numerical-correctness, error-handling]
    behaviors:
      - name: embedding-gather
        description: |
          Given token IDs [N] and embedding table [128256, 4096], produces
          output [N, 4096] by gathering rows. Handles out-of-vocabulary IDs
          by returning an error rather than reading out of bounds.

  # ============================================================
  # CUBLAS MATMUL WRAPPER
  # ============================================================
  - name: Matrix Multiplication
    path: backends/fracture-cuda
    description: |
      CUDA implementation of the Backend::matmul method. Wraps cuBLAS GEMM
      for FP16 matrix multiplication with FP32 accumulation. Handles the
      row-major to column-major translation internally — the engine always
      passes row-major tensors.
    shared: [numerical-correctness, error-handling]
    behaviors:
      - name: gemm-correctness
        description: |
          Computes C = A @ B where A is [M, K] and B is [K, N], all FP16 row-major.
          Uses cublasGemmEx with CUBLAS_COMPUTE_32F. Row-major convention handled
          via the transpose trick (swap A,B in cuBLAS call). Output C is [M, N] FP16.
          Must match PyTorch matmul reference for the specific shapes used in Llama 3:
          [1, 4096]x[4096, 4096], [512, 4096]x[4096, 14336], [1, 14336]x[14336, 4096],
          [1, 4096]x[4096, 128256].

      - name: gemm-edge-cases
        description: |
          Handles M=1 (decode) and large M (prefill) correctly. Handles the
          asymmetric shapes in GQA (K/V projections are [4096, 1024] not [4096, 4096]).
          Does not crash or produce NaN for any valid input shape.

  # ============================================================
  # KV CACHE MANAGER
  # ============================================================
  - name: KV Cache Manager
    path: crates/fracture-engine/src
    description: |
      Manages GPU memory for key/value cache across all layers and sequences.
      Phase 1 uses contiguous allocation per sequence.
    shared: [error-handling]
    behaviors:
      - name: cache-allocation
        description: |
          Allocates KV cache for a new sequence. Pre-allocates buffers for
          max_seq_len tokens across all 32 layers. Returns opaque CacheHandle.
          Fails with error if GPU memory is insufficient.

      - name: cache-append-prefill
        description: |
          During prefill, appends K and V tensors for multiple positions at once
          (e.g. positions 0..512 for a 512-token prompt). Writes to correct
          offsets within the pre-allocated buffer for each layer.

      - name: cache-append-decode
        description: |
          During decode, appends K and V tensors for a single new position.
          Writes to the next available slot in the buffer for each layer.
          Tracks current sequence length correctly.

      - name: cache-retrieval
        description: |
          Returns cached K and V tensors up to the current sequence length
          for a given layer. The returned tensors must be contiguous views
          into the pre-allocated buffer (no copies). Shape is
          [current_seq_len, 8, 128] for both K and V.

      - name: cache-lifecycle
        description: |
          Free releases all GPU memory for a completed sequence.
          After free, the CacheHandle is invalid and any operation on it
          returns an error. Memory is available for reuse by new sequences.

      - name: cache-bounds
        description: |
          Append at a position beyond max_seq_len returns an error rather
          than writing out of bounds. Retrieval with seq_len=0 returns
          empty tensors (valid for first prefill step).

  # ============================================================
  # COMPUTE ENGINE
  # ============================================================
  - name: Compute Engine
    path: crates/fracture-engine/src
    description: |
      Orchestrates the transformer forward pass by dispatching operations through
      the Backend trait. Contains no CUDA or Metal imports — all GPU operations
      are Backend trait method calls.
    shared: [numerical-correctness, error-handling, backend-agnostic]
    behaviors:
      - name: single-layer-forward
        description: |
          Executes a single transformer layer: RMSNorm → QKV projection →
          RoPE → KV cache update → GQA attention → output projection →
          residual add → RMSNorm → SwiGLU FFN → residual add.
          Output hidden state matches PyTorch reference for layer 0.

      - name: full-forward-prefill
        description: |
          Executes all 32 layers on a multi-token input (prefill).
          Final logits match PyTorch reference for a known test prompt.
          KV cache is populated for all layers at all prompt positions.

      - name: full-forward-decode
        description: |
          Executes all 32 layers on a single-token input (decode step).
          Reads from KV cache for prior tokens, appends new KV entry.
          Logits match PyTorch reference for the specific decode step.

      - name: layer-range-execution
        description: |
          Accepts a layer_range parameter. When range is a subset (e.g. 0..16),
          accepts activation tensor as input and returns activation tensor
          (not logits). When range is 0..32, accepts token IDs and returns logits.
          This is the Phase 2 hook for distributed inference.

      - name: prefill-decode-consistency
        description: |
          The logits produced by decode step N+1 are identical to what you'd
          get by running prefill on the full sequence [0..N+1] and taking
          the last position's logits. This validates that KV caching produces
          numerically identical results to recomputation.

  # ============================================================
  # SAMPLING
  # ============================================================
  - name: Sampling
    path: crates/fracture-generate/src
    description: |
      Token selection from logit distributions. Runs on CPU.
    shared: [error-handling]
    behaviors:
      - name: temperature-scaling
        description: |
          Divides logits by temperature before softmax. Temperature=0 produces
          argmax (greedy) selection. Temperature=1.0 leaves distribution unchanged.
          Higher temperatures flatten the distribution. Temperature must be >= 0.

      - name: top-k-filtering
        description: |
          Keeps only the K highest logits, setting all others to -inf before
          softmax. K=1 is equivalent to greedy. K=vocab_size disables filtering.
          K=0 disables filtering.

      - name: top-p-filtering
        description: |
          After softmax, sorts tokens by probability descending and keeps the
          smallest set whose cumulative probability exceeds top_p. top_p=1.0
          disables filtering. top_p=0.0 keeps only the most probable token.

      - name: greedy-determinism
        description: |
          With temperature=0 (or temperature=1 with top_k=1), the same logits
          always produce the same token. No randomness involved.

      - name: combined-filtering
        description: |
          Top-K is applied before top-P. The filters compose correctly:
          top_k=50, top_p=0.9 first restricts to 50 tokens then further
          restricts by cumulative probability.

  # ============================================================
  # GENERATION LOOP
  # ============================================================
  - name: Generation Loop
    path: crates/fracture-generate/src
    description: |
      Orchestrates the full generation pipeline: tokenize, prefill,
      decode loop, detokenize, and streaming.
    shared: [error-handling]
    behaviors:
      - name: tokenization
        description: |
          Converts input text to token IDs using the Llama 3 tokenizer.
          Handles special tokens (BOS). Round-trips correctly:
          detokenize(tokenize(text)) == text for ASCII inputs.

      - name: prefill-to-decode-transition
        description: |
          After prefill, the generation loop correctly transitions to decode mode.
          The first decode step uses the last token from prefill as input.
          KV cache state is consistent between prefill and first decode.

      - name: stop-conditions
        description: |
          Generation stops on: EOS token (128001 or 128008 or 128009 for Llama 3),
          max_tokens reached, or stop string encountered in output.
          The stop token itself is not included in the output.

      - name: token-streaming
        description: |
          Each generated token is sent through the output channel immediately
          after generation, not buffered until completion. The channel is
          a tokio mpsc channel that the HTTP layer reads from.

  # ============================================================
  # HTTP SERVER
  # ============================================================
  - name: HTTP Server
    path: crates/fracture-server/src
    description: |
      OpenAI-compatible HTTP API for completions and chat.
    shared: [error-handling]
    behaviors:
      - name: completions-endpoint
        description: |
          POST /v1/completions accepts JSON with model, prompt, max_tokens,
          temperature, top_p, top_k, and stream fields. Returns JSON response
          with choices array containing generated text. Validates required
          fields. Returns 400 on malformed requests.

      - name: chat-completions-endpoint
        description: |
          POST /v1/chat/completions accepts messages array with role/content
          objects. Applies Llama 3 chat template to convert messages to prompt.
          Returns response in chat completion format with message object.

      - name: sse-streaming
        description: |
          When stream=true, returns text/event-stream content type. Sends
          data: {json}\n\n for each token. Sends data: [DONE]\n\n at end.
          Each SSE event contains a delta object with the new token content.

      - name: non-streaming
        description: |
          When stream=false (default), waits for full generation to complete
          and returns the complete response in a single JSON object.

      - name: request-validation
        description: |
          Returns 400 for: missing prompt/messages field, invalid temperature
          (negative), invalid top_p (not in 0..1), invalid top_k (negative),
          max_tokens=0. Returns 415 for non-JSON content type.

      - name: chat-template
        description: |
          Applies the Llama 3 chat template correctly. System messages are
          wrapped in the appropriate header tags. User and assistant messages
          alternate with correct delimiters. The template output matches
          what HuggingFace tokenizer.apply_chat_template produces.
