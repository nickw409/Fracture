project: Fracture
description: |
  Cross-platform GPU-accelerated LLM inference server in Rust with pluggable backends.
  Phase 1: single-node inference for Llama 3 8B via GGUF, served over OpenAI-compatible HTTP API.
  Phase 2: node abstraction — engine operates on arbitrary layer ranges, accepts/returns activation
  tensors, enabling pipeline-parallel inference across multiple nodes on one machine.
  Phase 3: distributed inference — wire protocol, scheduling, heartbeat, multi-machine pipeline.
  Phase 4: production inference — paged KV cache, continuous batching, distributed batching.
  Dashboard: React/TypeScript observability UI with cluster topology, live metrics, inference
  playground, and scheduler visualization. Served as static files or via Vite dev proxy.
  CUDA backend initially; engine is backend-agnostic via the Backend trait to support Metal in Phase 5+.
  Testing validates correctness at every layer from individual GPU kernels through end-to-end generation.

shared:
  - name: numerical-correctness
    description: |
      All tensor-producing operations must match PyTorch reference outputs within FP16 tolerance
      (rtol=1e-3, atol=1e-3). Reference tensors are generated by scripts/dump_reference.py and
      stored in tests/reference/. Tests load reference tensors, run the Fracture implementation
      on identical inputs, and assert element-wise closeness. Any test that produces or transforms
      tensors must validate against this reference.

  - name: error-handling
    description: |
      All fallible operations return typed errors via Result. Errors propagate with context
      (which layer, which kernel, which tensor). Backend errors (CUDA status, Metal errors) are
      mapped to Rust error types in the backend crate, never exposed to the engine. No panics in
      library crates. Panics are acceptable only in the server binary entry point for unrecoverable
      startup failures.

  - name: backend-agnostic
    description: |
      The engine, generation loop, server, and protocol crates never import or depend on any
      backend crate (fracture-cuda, fracture-metal). All GPU operations go through the Backend
      trait defined in fracture-core. DeviceTensor is an opaque handle — the engine never
      dereferences device pointers. Only the final binary in bins/ selects and instantiates
      a concrete backend.

sections:
  # ============================================================
  # CORE TYPES AND BACKEND TRAIT
  # ============================================================
  - name: Core Types
    path: crates/fracture-core/src
    status: implemented
    description: |
      Shared types used by all crates: DeviceTensor, Backend trait, ModelConfig,
      DType, error types. This crate defines the contract between the engine and
      any GPU backend.
    shared: [error-handling, backend-agnostic]
    behaviors:
      - name: model-config-validation
        status: implemented
        description: |
          ModelConfig validates required fields: hidden_size, num_layers,
          num_q_heads, num_kv_heads, head_dim, intermediate_size, vocab_size,
          rope_theta, rms_norm_eps. Derived values are consistent
          (head_dim == hidden_size / num_q_heads). Errors on missing or
          inconsistent values.

      - name: gqa-divisibility-validation
        status: implemented
        description: |
          ModelConfig validates that num_q_heads is evenly divisible by
          num_kv_heads (required for GQA grouping). Returns an error if
          num_q_heads % num_kv_heads != 0. This invariant is assumed by
          the attention kernel where group_size = num_q_heads / num_kv_heads.

      - name: device-tensor-metadata
        status: implemented
        description: |
          DeviceTensor exposes shape, dtype, and element count but never
          exposes device pointers. Operations that require shape/dtype
          (e.g., size validation, reshape) work correctly through the
          opaque handle. Only the backend can map a TensorId to actual
          device memory.

      - name: dtype-size-calculation
        status: implemented
        description: |
          DType::size_bytes returns correct byte sizes for each variant:
          FP16=2, FP32=4, BF16=2, INT8=1, INT4=1 (packed: 2 elements per
          byte). DeviceTensor::size_bytes handles INT4 specially: uses
          (numel + 1) / 2 instead of numel * size_bytes to account for
          packing. Used pervasively for buffer size validation in
          copy_to_device, copy_to_host, and weight loading. Incorrect
          sizes would cause silent memory corruption.

      - name: device-tensor-shape-validation
        status: implemented
        description: |
          DeviceTensor rejects invalid shapes on construction (e.g.,
          zero-sized dimensions, empty shape vector). A DeviceTensor with
          shape [4096, 0] or [] returns an error, not a tensor with 0
          elements that silently breaks downstream ops.

      - name: model-config-max-seq-len-validation
        status: implemented
        description: |
          ModelConfig validates that max_seq_len is > 0. A zero or negative
          max_seq_len would cause zero-sized cache allocations and undefined
          behavior in position tracking.

      - name: model-config-positive-field-validation
        status: implemented
        description: |
          ModelConfig validates that numeric fields (num_layers, hidden_size,
          vocab_size, intermediate_size, num_q_heads, num_kv_heads, head_dim)
          are strictly positive. A value of 0 causes zero-sized allocations,
          division by zero in derived values, or empty iteration ranges.

      - name: model-config-float-field-validation
        status: implemented
        description: |
          ModelConfig validates that rope_theta > 0 and rms_norm_eps > 0.
          Zero rms_norm_eps causes division by zero in RMSNorm; zero or
          negative rope_theta produces degenerate rotary embeddings.

      - name: device-tensor-reshape-validation
        status: implemented
        description: |
          Reshaping a DeviceTensor to a shape whose total element count
          differs from the original returns an error. The dtype and
          underlying device memory are unchanged by a valid reshape.

  # ============================================================
  # GGUF PARSER AND WEIGHT LOADING
  # ============================================================
  - name: GGUF Parser
    path: crates/fracture-gguf/src
    status: implemented
    description: |
      Parses GGUF binary files and loads model weights to GPU memory.
      Handles the GGUF v3 format including metadata, tensor info table,
      and tensor data with memory mapping.
    shared: [error-handling]
    behaviors:
      - name: header-parsing
        status: implemented
        description: |
          Reads GGUF magic number (0x46554747, "GGUF" as LE u32) and version.
          Rejects files with wrong magic number. Rejects unsupported versions
          (only v3 supported). Extracts tensor count and metadata KV count
          from header.

      - name: metadata-extraction
        status: implemented
        description: |
          Parses metadata key-value pairs from the GGUF file. Extracts model
          architecture config: hidden_size, num_layers, num_attention_heads,
          num_kv_heads, intermediate_size, vocab_size, rope_theta, rms_norm_eps.
          Returns typed ModelConfig struct. Errors on missing required keys.

      - name: tensor-info-parsing
        status: implemented
        description: |
          Parses the tensor info table. Extracts tensor name, shape, data type,
          and byte offset for each tensor. GGUF stores dimensions innermost-first;
          the parser reverses them to row-major order. Validates that expected
          tensors exist for the Llama architecture (embedding, per-layer
          Q/K/V/O/gate/up/down/norms, output norm, LM head). Errors on missing
          required tensors.

      - name: weight-loading
        status: implemented
        description: |
          Memory-maps the GGUF file and copies tensor data to GPU memory.
          Respects alignment requirements (256-byte aligned GPU allocations).
          Handles FP16, FP32, and BF16 tensor data types — F32 and BF16
          weights are converted to FP16 on the host before upload. Q and K
          weight matrices have their RoPE interleave permutation reversed on
          load (llama.cpp's convert_hf_to_gguf.py interleaves head rows for
          RoPE optimization; this is undone so the engine uses standard
          PyTorch weight ordering). Validates tensor byte sizes match expected
          shape x dtype size. Returns WeightStore with all tensors on GPU as
          FP16. Supports optional layer_range parameter for selective
          loading — when provided, only layers in the range are loaded
          (indexed from 0 in the resulting WeightStore). Global tensors
          (embedding, output_norm, lm_head) are always loaded. Errors on
          size mismatches or GPU allocation failures.

      - name: selective-layer-range-bounds
        status: implemented
        description: |
          When weight-loading receives a layer_range that exceeds the model's
          actual layer count in the GGUF file (e.g., layer_range 0..64 on a
          32-layer model), it returns a clear error rather than silently loading
          fewer layers or reading invalid tensor names.

      - name: bf16-weight-conversion
        status: implemented
        description: |
          BF16 tensors in GGUF files are converted to FP16 on the host
          before GPU upload via BF16→F32→FP16 conversion. Each BF16 value
          is reinterpreted as the upper 16 bits of an F32 (left-shifted
          by 16), then truncated to FP16. Applied to any tensor with GGUF
          dtype code 30 (BF16). Tested by build_gguf_with_bf16_norms and
          test_bf16_to_fp16_conversion.

      - name: alignment-handling
        status: implemented
        description: |
          GGUF v3 files specify a data alignment value in metadata (default 32
          bytes). The parser uses this alignment to correctly compute the start
          offset of the tensor data section after the metadata and tensor info
          table. Incorrect alignment calculation would cause all tensor reads
          to be shifted, producing corrupt weights.

      - name: truncated-file-detection
        status: implemented
        description: |
          When the GGUF file is truncated or corrupted (tensor data section
          is shorter than what tensor offsets + sizes require), weight loading
          returns a clear error rather than reading out of bounds. Validates
          that each tensor's byte range falls within the memory-mapped file.

      - name: unsupported-dtype-rejection
        status: implemented
        description: |
          When the GGUF file contains tensors with quantization types other
          than FP16/FP32/BF16 (e.g. Q4_0, Q8_0, Q4_K_M), parsing returns a
          clear UnsupportedDType error identifying the unsupported dtype.
          This prevents silently misinterpreting quantized tensor data.

      - name: weight-naming
        status: implemented
        description: |
          Maps GGUF tensor names (token_embd.weight, blk.{i}.attn_q.weight, etc.)
          to the LayerWeights struct fields. Handles all Llama 3 weight names
          including embedding, per-layer Q/K/V/O/gate/up/down/norms, output norm,
          and LM head. Ignores unknown tensor names with a warning rather than failing.

  # ============================================================
  # CUDA KERNELS
  # ============================================================
  - name: RMSNorm Kernel
    path: backends/fracture-cuda
    status: implemented
    description: |
      CUDA implementation of the Backend::rmsnorm method. Root Mean Square
      Layer Normalization applied before attention and FFN sublayers.
      Uses FP32 accumulation with warp reduction.
      A Metal backend would implement the same operation independently.
    shared: [numerical-correctness, error-handling]
    behaviors:
      - name: rmsnorm-forward
        status: implemented
        description: |
          Computes RMSNorm: output = (x / sqrt(mean(x^2) + eps)) * weight.
          Input x is [N, 4096], weight is [4096], eps is 1e-5.
          Sum-of-squares accumulation uses FP32 to prevent precision loss.
          Warp reduction used for parallel sum computation.
          Output is FP16. Must match PyTorch reference for N=1 (decode)
          and N>1 (prefill, e.g. N=128, N=512).

      - name: rmsnorm-numerical-stability
        status: implemented
        description: |
          Handles edge cases: all-zero input (should produce all-zero output),
          very large input values (no overflow in FP32 accumulator),
          very small input values (eps prevents division by zero).

  - name: RoPE Kernel
    path: backends/fracture-cuda
    status: implemented
    description: |
      CUDA implementation of the Backend::rope method. Rotary Positional
      Embeddings applied to Q and K tensors after projection, before attention.
      Uses pre-computed frequency table.
    shared: [numerical-correctness, error-handling]
    behaviors:
      - name: rope-precomputation
        status: implemented
        description: |
          Pre-computes inverse frequency table on initialization:
          freq[i] = theta^(-2i/d_head) for i in 0..head_dim/2, where
          d_head=128 and theta=500000. Table stored on GPU (head_dim/2
          floats), reused across all layers and forward passes. Sin/cos
          values are computed on-the-fly in the kernel by multiplying
          position * freq[i], so no max_seq_len-sized table is needed.

      - name: rope-apply
        status: implemented
        description: |
          Applies rotary embedding to Q [N, 32, 128] and K [N, 8, 128] tensors.
          Uses the split-half convention matching PyTorch/HuggingFace: dimension
          pairs (d, d+head_dim/2) are rotated together, not adjacent pairs.
          Pre-computed sin/cos values are looked up at the given sequence positions.
          Must handle non-contiguous positions (e.g. positions=[47] during decode
          at step 47). Must match PyTorch reference for both prefill (many
          positions) and decode (single position).

      - name: rope-position-out-of-bounds
        status: not-implemented
        description: |
          Not applicable with the current design. The frequency table is
          indexed by dimension (0..head_dim/2), not by position. Positions
          are multiplied with frequencies on-the-fly, so any u32 position
          value works without out-of-bounds GPU reads. No bounds check is
          needed or implemented.

  - name: SiLU Multiply Kernel
    path: backends/fracture-cuda
    status: implemented
    description: |
      CUDA implementation of the Backend::silu_mul method. Fused SiLU activation
      and elementwise multiplication used in SwiGLU FFN.
    shared: [numerical-correctness, error-handling]
    behaviors:
      - name: silu-mul-forward
        status: implemented
        description: |
          Computes silu(gate) * up where silu(x) = x * sigmoid(x).
          Both gate and up are [N, 14336]. Output is [N, 14336].
          Fused into a single kernel (no intermediate materialization).
          Must match PyTorch reference for N=1 and N>1.

      - name: silu-mul-shape-mismatch
        status: implemented
        description: |
          Returns an error when gate and up tensors have different shapes.

  - name: Attention Kernel
    path: backends/fracture-cuda
    status: implemented
    description: |
      CUDA implementation of the Backend::attention method. Scaled dot-product
      attention with causal masking and GQA. Naive implementation with
      FP32 softmax accumulation. The most complex kernel in any backend.
    shared: [numerical-correctness, error-handling]
    behaviors:
      - name: attention-prefill
        status: implemented
        description: |
          Computes causal self-attention during prefill. Q is [N, 32, 128],
          K_cache and V_cache are [N, 8, 128] (no prior cache, all new).
          Applies causal mask so position i only attends to positions 0..i.
          Each group of 4 Q heads shares 1 KV head (GQA with group size 4).
          Softmax computed in FP32 for numerical stability.
          Output is [N, 32, 128]. Must match PyTorch reference.

      - name: attention-decode
        status: implemented
        description: |
          Computes attention during decode. Q is [1, 32, 128] (single new token).
          K_cache and V_cache are [seq_len, 8, 128] (all prior tokens + current).
          No causal mask needed (single query naturally attends to all keys).
          GQA head expansion applies. Output is [1, 32, 128].
          Tested at production dimensions with representative cache lengths.

      - name: attention-score-scaling
        status: implemented
        description: |
          Attention scores are divided by sqrt(head_dim) = sqrt(128) before
          softmax. Uses rsqrtf for efficient computation. Without this scaling,
          softmax saturates and produces near-one-hot distributions, causing
          incorrect attention output.

      - name: attention-gqa-correctness
        status: implemented
        description: |
          Validates that GQA head sharing is correct: Q heads 0-3 share KV head 0,
          Q heads 4-7 share KV head 1, etc. Compare against explicit per-head
          computation to ensure grouping produces identical results.

      - name: attention-causal-mask-correctness
        status: implemented
        description: |
          The causal mask is validated independently: position i must have zero
          attention weight on positions j > i during prefill. Verified via
          carefully constructed inputs (e.g., one-hot V vectors) where the
          output directly reveals which positions were attended to, making
          off-by-one or missing mask errors detectable without exposing raw
          attention weights.

      - name: attention-pytorch-reference
        status: implemented
        description: |
          test_kernel_attention_layer0 loads layer_00/q_rope.bin, k_rope.bin,
          v.bin, and attn_output.bin from the PyTorch reference dump. Uploads
          Q, K, V to GPU, runs Backend::attention with start_pos=0 and a
          contiguous KV cache sized to seq_len, then applies o_proj to produce
          the full self-attention block output. Asserts element-wise closeness
          against the PyTorch reference within LOOSE_RTOL/LOOSE_ATOL (5e-3).

  - name: Embedding Lookup
    path: backends/fracture-cuda
    status: implemented
    description: |
      CUDA implementation of the Backend::embedding method. Token ID to
      embedding vector lookup on device with bounds checking.
    shared: [numerical-correctness, error-handling]
    behaviors:
      - name: embedding-gather
        status: implemented
        description: |
          Given token IDs [N] and embedding table [128256, 4096], produces
          output [N, 4096] by gathering rows. Out-of-vocabulary token IDs
          (>= vocab_size) produce zero-filled embeddings in the output.
          The CUDA kernel clamps OOV IDs to write zeros rather than reading
          out of bounds. No host-side validation is performed on token IDs.

  # ============================================================
  # CUBLAS MATMUL WRAPPER
  # ============================================================
  - name: Matrix Multiplication
    path: backends/fracture-cuda
    status: implemented
    description: |
      CUDA implementation of the Backend::matmul method. Wraps cuBLAS GEMM
      for FP16 matrix multiplication with FP32 accumulation. Computes
      C = A @ B^T, matching the GGUF/PyTorch nn.Linear weight convention
      where weights are stored as [N, K] (output_features x input_features).
      Handles the row-major to column-major translation internally —
      the engine always passes row-major tensors.
    shared: [numerical-correctness, error-handling]
    behaviors:
      - name: gemm-correctness
        status: implemented
        description: |
          Computes C = A @ B^T where A is [M, K] and B is [N, K], all FP16
          row-major. GGUF weight matrices are stored as [N, K] matching
          PyTorch nn.Linear convention (y = x @ W^T). Uses cublasGemmEx with
          CUBLAS_COMPUTE_32F and CUBLAS_OP_T on B. Output C is [M, N] FP16.
          Must match PyTorch reference for the specific shapes used in Llama 3:
          [1, 4096]x[4096, 4096], [512, 4096]x[14336, 4096],
          [1, 14336]x[4096, 14336], [1, 4096]x[128256, 4096].

      - name: gemm-edge-cases
        status: implemented
        description: |
          Handles M=1 (decode) and large M (prefill) correctly. Handles the
          asymmetric shapes in GQA (K/V projections are [1024, 4096] not
          [4096, 4096]). Does not crash or produce NaN for any valid input shape.

      - name: gemm-dimension-mismatch-error
        status: implemented
        description: |
          Returns a typed error when A and B have incompatible inner
          dimensions (A is [M, K1] and B is [N, K2] where K1 != K2).

  # ============================================================
  # CUDA BACKEND (MEMORY MANAGEMENT)
  # ============================================================
  - name: CUDA Memory Management
    path: backends/fracture-cuda
    status: implemented
    description: |
      CUDA implementation of Backend memory operations: alloc, free,
      copy_to_device, copy_to_host, and copy_rows. Manages GPU memory
      allocation and host-device transfers.
    shared: [error-handling]
    behaviors:
      - name: alloc-free
        status: implemented
        description: |
          Allocates GPU memory for tensors of arbitrary shape and dtype.
          Free releases GPU memory and invalidates the TensorId.
          Double-free or use-after-free returns an error.

      - name: host-device-transfer
        status: implemented
        description: |
          copy_to_device transfers host FP16 data to a GPU tensor.
          copy_to_host transfers GPU tensor data back to host memory.
          Both validate that buffer sizes match tensor shape x dtype size.

      - name: copy-rows
        status: implemented
        description: |
          Copies a contiguous range of rows from one tensor to another.
          Used by the KV cache to write new K/V entries into pre-allocated
          buffers at the correct offset.

      - name: copy-rows-bounds-validation
        status: implemented
        description: |
          copy_rows validates that the source row range (offset + count)
          does not exceed the source tensor's row dimension, and that the
          destination has sufficient capacity at the target offset. Returns
          an error on out-of-bounds rather than performing an invalid GPU
          memory access. This is the safety boundary that the KV cache's
          cache-bounds behavior depends on.

      - name: alloc-oom
        status: implemented
        description: |
          Allocating a tensor when GPU memory is exhausted returns an error
          rather than crashing or invoking undefined behavior.

      - name: copy-rows-shape-compatibility
        status: implemented
        description: |
          copy_rows validates that source and destination tensors have the
          same column width and dtype, returning an error on mismatch rather
          than performing a malformed copy.

  # ============================================================
  # ADD KERNEL
  # ============================================================
  - name: Elementwise Add Kernel
    path: backends/fracture-cuda
    status: implemented
    description: |
      CUDA implementation of the Backend::add method. Elementwise addition
      of two tensors, used for residual connections in the transformer.
    shared: [numerical-correctness, error-handling]
    behaviors:
      - name: add-forward
        status: implemented
        description: |
          Computes output = a + b elementwise. Both inputs and output are FP16.
          Used for residual connections after attention and FFN sublayers.

      - name: add-shape-mismatch
        status: implemented
        description: |
          Returns an error when the two input tensors have different shapes.

  # ============================================================
  # CUDA PROFILING
  # ============================================================
  - name: CUDA Profiling
    path: backends/fracture-cuda
    status: implemented
    description: |
      GPU timer and NVTX marker implementations for the CUDA backend.
      Timers use CUDA events for accurate kernel timing. NVTX markers
      annotate GPU operations for Nsight Systems profiling.
    shared: [error-handling]
    behaviors:
      - name: gpu-timers
        status: implemented
        description: |
          Implements create_timer, start_timer, stop_timer, destroy_timer
          using CUDA event pairs (cudaEventCreate/Record/ElapsedTime/Destroy).
          Managed by TimerManager which tracks event pairs by DeviceTimer ID.
          Returns elapsed milliseconds with GPU-accurate timing.

      - name: nvtx-markers
        status: implemented
        description: |
          Implements marker_push and marker_pop using NVTX range API
          (nvtxRangePushA/nvtxRangePop). All Backend compute operations
          (matmul, rmsnorm, rope, attention, silu_mul, embedding, add)
          are annotated with NVTX ranges for profiling visibility in
          Nsight Systems. Handles null bytes in names gracefully via
          CString fallback. NVTX calls have negligible overhead when
          Nsight is not attached (no kernel-level cost, just a function
          call that early-returns).

  # ============================================================
  # KV CACHE MANAGER
  # ============================================================
  - name: KV Cache Manager
    path: crates/fracture-engine/src
    status: implemented
    description: |
      Manages GPU memory for key/value cache across all layers and sequences.
      Phase 1 uses contiguous allocation per sequence. Tracks per-layer
      seq_len for cache append and retrieval.
    shared: [error-handling]
    behaviors:
      - name: cache-allocation
        status: implemented
        description: |
          Allocates KV cache for a new sequence. Pre-allocates buffers for
          max_seq_len tokens across num_layers layers (which may be less than
          the full model when used by a pipeline node with a partial layer
          range). Returns opaque CacheHandle. Fails with error if GPU memory
          is insufficient.

      - name: cache-append-prefill
        status: implemented
        description: |
          During prefill, appends K and V tensors for multiple positions at once
          (e.g. positions 0..512 for a 512-token prompt). Writes to correct
          offsets within the pre-allocated buffer for each layer.

      - name: cache-append-decode
        status: implemented
        description: |
          During decode, appends K and V tensors for a single new position.
          Writes to the next available slot in the buffer for each layer.
          Tracks current sequence length correctly.

      - name: cache-current-seq-len-tracking
        status: implemented
        description: |
          After prefill appends N tokens and K decode steps each append 1,
          cache reports current sequence length as N+K for any layer.
          Incorrect tracking would cause attention to read stale/uninitialized
          cache slots or miss valid entries.

      - name: cache-retrieval
        status: implemented
        description: |
          Returns the full pre-allocated K and V cache tensors for a given
          layer. Shape is [max_seq_len, num_kv_heads, head_dim] for both
          K and V. The engine uses the tracked seq_len to bound the valid
          region when passing to attention (no copies, no slicing). This
          avoids per-retrieval allocations.

      - name: cache-lifecycle
        status: implemented
        description: |
          Free releases all GPU memory for a completed sequence.
          After free, the CacheHandle is invalid and any operation on it
          returns an error. Memory is available for reuse by new sequences.

      - name: cache-bounds
        status: implemented
        description: |
          Append at a position beyond max_seq_len returns an error rather
          than writing out of bounds. At seq_len=0 (before any append),
          the full pre-allocated buffer is still returned — the engine
          passes seq_len=0 to attention which reads zero cache entries.

      - name: cache-multi-sequence
        status: implemented
        description: |
          Multiple sequences can be allocated and managed simultaneously
          with independent cache state. Appending to or freeing one
          sequence's cache does not corrupt another sequence's cached
          values. Required for Phase 4 continuous batching.

      - name: cache-layer-bounds
        status: implemented
        description: |
          Append or retrieval for a layer index outside the cache's allocated
          layer range returns an error rather than accessing invalid memory.

  # ============================================================
  # COMPUTE ENGINE
  # ============================================================
  - name: Compute Engine
    path: crates/fracture-engine/src
    status: implemented
    description: |
      Orchestrates the transformer forward pass by dispatching operations through
      the Backend trait. Contains no CUDA or Metal imports — all GPU operations
      are Backend trait method calls. Full forward pass: embed -> 32 layers
      (rmsnorm -> QKV proj -> rope -> cache update -> GQA attention -> output
      proj -> residual -> rmsnorm -> SwiGLU FFN -> residual) -> final norm ->
      LM head. Uses scratch tensor reuse to minimize allocations.
    shared: [numerical-correctness, error-handling, backend-agnostic]
    behaviors:
      - name: single-layer-forward
        status: implemented
        description: |
          Executes a single transformer layer: RMSNorm -> QKV projection ->
          RoPE -> KV cache update -> GQA attention -> output projection ->
          residual add -> RMSNorm -> SwiGLU FFN -> residual add.
          Output hidden state matches PyTorch reference for layer 0.

      - name: full-forward-prefill
        status: implemented
        description: |
          Executes all 32 layers on a multi-token input (prefill).
          Final logits match PyTorch reference for a known test prompt.
          KV cache is populated for all layers at all prompt positions.

      - name: full-forward-decode
        status: implemented
        description: |
          Executes all 32 layers on a single-token input (decode step).
          Reads from KV cache for prior tokens, appends new KV entry.
          Logits match PyTorch reference for the specific decode step.

      - name: layer-range-execution
        status: implemented
        description: |
          Accepts a layer_range parameter. When range is a subset (e.g. 0..16),
          accepts activation tensor as input and returns activation tensor
          (not logits). When range is 0..32, accepts token IDs and returns logits.
          Uses two distinct local indices: weight_idx (layer_idx - engine.layer_range.start)
          for weight store access, and cache_idx (layer_idx - node_config.layer_range.start)
          for KV cache access. This distinction allows a single full-model engine to
          serve different node configs (head, tail) while each node's cache is sized
          only for its own layer range.

      - name: forward-node-dispatch
        status: implemented
        description: |
          forward_node() dispatches based on NodeConfig role:
          - Head node (is_head): TokenIds -> embedding -> layers -> Activations
          - Middle node: Activations -> layers -> Activations
          - Tail node (is_tail): input -> layers -> rmsnorm -> lm_head -> Logits
          - Full node (is_head + is_tail): TokenIds -> everything -> Logits
          The existing forward() method is a backward-compatible wrapper that
          creates a full-range NodeConfig and delegates to forward_node().
          Returns error if head node receives Activations or non-head receives TokenIds.

      - name: activation-tensor-handoff
        status: implemented
        description: |
          When a non-tail node completes its layer range, it returns the hidden
          state as NodeOutput::Activations(DeviceTensor). The tensor stays on GPU
          (no device-to-host copy) for in-process pipeline chaining. The next node
          receives it as NodeInput::Activations and uses it as its initial hidden
          state. Scratch tensors are freed; the output hidden state is NOT freed
          (ownership transfers to the caller).

      - name: profiling-dispatch
        status: implemented
        description: |
          When profiling is enabled (profile parameter is Some), the engine
          creates GPU timers via timed_op() and records per-layer timing for
          each operation (rmsnorm, QKV projection, RoPE, attention, output
          projection, FFN). NVTX markers are always emitted via marker_push/
          marker_pop. When profiling is disabled (None), no timers are created
          and there is zero overhead. Results are collected into ForwardProfile
          with per-layer LayerProfile structs.

      - name: prefill-decode-consistency
        status: implemented
        description: |
          The logits produced by decode step N+1 are identical to what you'd
          get by running prefill on the full sequence [0..N+1] and taking
          the last position's logits. This validates that KV caching produces
          numerically identical results to recomputation. Tested by
          test_gpu_prefill_decode_consistency in GPU integration tests.

      - name: scratch-tensor-reuse
        status: implemented
        description: |
          The engine reuses scratch tensors across layers rather than
          allocating new GPU memory per layer. Peak GPU memory during a
          multi-layer forward pass is O(1) scratch buffers, not O(num_layers).
          Tested by test_scratch_tensor_reuse_across_layers which verifies
          alloc counts are constant across 2-layer vs 4-layer models.

      - name: forward-node-input-type-validation
        status: implemented
        description: |
          forward_node() returns a clear error when given mismatched input:
          TokenIds to a non-head (middle/tail-only) node, or Activations
          to a head node. Distinct from forward-node-dispatch which tests
          the happy path — this validates the error path specifically.

  # ============================================================
  # NODE ABSTRACTION (Phase 2)
  # ============================================================
  - name: Node Abstraction
    path: crates/fracture-engine/src
    status: implemented
    description: |
      Phase 2 node abstraction layer. Defines NodeConfig, NodeInput/NodeOutput
      enums, and the ComputeNode trait that wraps the Engine for pipeline-parallel
      inference. Each node processes an arbitrary layer range and communicates
      via activation tensors.
    shared: [error-handling, backend-agnostic]
    behaviors:
      - name: node-config-validation
        status: implemented
        description: |
          NodeConfig validates layer_range is non-empty and does not exceed
          total_layers. Derives is_head (starts at 0), is_tail (ends at
          total_layers), and is_full (both) from the range and total layer
          count, preventing invariant violations from manual boolean fields.

      - name: local-node-forward
        status: implemented
        description: |
          ComputeNodeImpl wraps Engine and delegates forward passes based
          on node role: head nodes accept TokenIds and return Activations,
          tail nodes accept input and return Logits, full nodes accept
          TokenIds and return Logits. Type mismatches (TokenIds to non-head,
          Activations to head) return Pipeline errors. Tested via pipeline
          split equivalence tests that chain multiple ComputeNodeImpls.

      - name: middle-node-forward
        status: implemented
        description: |
          A node that is neither head nor tail (is_head=false, is_tail=false)
          accepts Activations as input and returns Activations as output,
          processing only its layer range. Sending TokenIds to a middle node
          returns a Pipeline error.

  # ============================================================
  # NODE IPC (Phase 2)
  # ============================================================
  - name: Node IPC
    path: crates/fracture-engine/src
    status: implemented
    description: |
      Unix domain socket transport for single-machine multi-process pipeline
      validation. Provides framed message protocol (length-prefixed bincode),
      activation tensor serialization (GPU->CPU->bytes->CPU->GPU), and
      IpcNodeServer/IpcNodeClient that implement the ComputeNode interface
      over sockets. Phase 3 replaces this with TCP/QUIC networking.
    shared: [error-handling, backend-agnostic]
    dismissed:
      - suggestion: ipc-sequence-cleanup
        reason: IPC is Phase 2, superseded by Phase 3 wire protocol; adding new features to transitional transport is wasted spec
      - suggestion: kv-cache-lifecycle
        reason: same concern as ipc-sequence-cleanup; IPC superseded by Phase 3
      - suggestion: ipc-mid-request-disconnect
        reason: IPC is Phase 2, superseded by Phase 3 wire protocol
      - suggestion: ipc-kv-cache-lifecycle
        reason: IPC superseded by Phase 3; same concern as ipc-sequence-cleanup
      - suggestion: ipc-concurrent-connections
        reason: IPC superseded by Phase 3; concurrency semantics not worth specifying for transitional transport
      - suggestion: ipc-info-roundtrip
        reason: IPC superseded by Phase 3; info query path is a minor detail
      - suggestion: ipc-kv-cache-release
        reason: same as ipc-sequence-cleanup; IPC superseded by Phase 3
    behaviors:
      - name: activation-tensor-serialization
        status: implemented
        description: |
          Serializes DeviceTensor as: [4 bytes ndim][4 bytes x ndim shape]
          [4 bytes dtype tag][N bytes raw data]. Data is copied GPU->host
          for serialization and host->GPU for deserialization. Roundtrip
          preserves shape, dtype, and data exactly. Tested with MemBackend
          that stores tensor data in memory.

      - name: framed-message-protocol
        status: implemented
        description: |
          Messages are length-prefixed (u32 big-endian) bincode payloads.
          IpcMessage enum carries ForwardRequest (seq_id, positions, token_ids
          or serialized tensor), ForwardResponse (seq_id, logits or serialized
          tensor), InfoRequest, and InfoResponse. Roundtrip serialization
          preserves all fields exactly.

      - name: ipc-node-server
        status: implemented
        description: |
          IpcNodeServer wraps a ComputeNode and KvCacheManager, listens on
          a Unix socket, and handles ForwardRequest/InfoRequest messages.
          Manages KV cache per seq_id (allocates on first use). serve()
          handles multiple connections; serve_one() handles a single
          connection then returns. Serializes activation outputs and
          logits back to the client.

      - name: ipc-node-client
        status: implemented
        description: |
          IpcNodeClient implements ComputeNode over a Unix socket connection.
          Serializes NodeInput (token IDs or activation tensor) into an
          IpcMessage, sends it to the server, deserializes the response
          back into NodeOutput. Can be used as a node in PipelineCoordinator,
          enabling cross-process pipeline splits.

      - name: ipc-split-equivalence
        status: implemented
        description: |
          A 2-node pipeline with the tail node served over a Unix socket
          produces identical output to an in-process pipeline. Tested with
          both prefill (3 tokens) and multi-step decode (prefill + 3 decode
          steps). Validates that the GPU->CPU->socket->CPU->GPU activation
          transfer path preserves numerical correctness.

      - name: ipc-connection-failure
        status: implemented
        description: |
          IpcNodeClient returns a clear error when the Unix socket path does
          not exist or the server is not listening. IpcNodeServer returns an
          error when the socket path is already in use.

  # ============================================================
  # PIPELINE COORDINATOR (Phase 2)
  # ============================================================
  - name: Pipeline Coordinator
    path: crates/fracture-engine/src
    status: implemented
    description: |
      Orchestrates a pipeline of ComputeNodes, chaining activation tensors
      from head through middle(s) to tail to produce logits from token IDs.
      Each node has its own KvCacheManager sized for its layer range.
    shared: [error-handling, backend-agnostic]
    behaviors:
      - name: pipeline-validation
        status: implemented
        description: |
          PipelineCoordinator::new() validates: at least one node, first node
          is head, last node is tail, layer ranges are contiguous (no gaps or
          overlaps between adjacent nodes). Returns Pipeline error on violation.

      - name: pipeline-layer-coverage-validation
        status: implemented
        description: |
          PipelineCoordinator::new() validates that the node layer ranges
          collectively cover [0, total_layers) completely — not just
          contiguous and non-overlapping, but also starting at 0 and ending
          at total_layers. A pipeline covering [0,16) + [16,24) on a
          32-layer model returns an error.

      - name: pipeline-forward
        status: implemented
        description: |
          Chains forward passes through all nodes. Carries positions array
          through unchanged (needed for RoPE at every node). Converts
          NodeOutput::Activations from one node into NodeInput::Activations
          for the next. Returns error if an intermediate node produces Logits
          or the final node produces Activations.

      - name: single-node-equivalence
        status: implemented
        description: |
          A PipelineCoordinator with a single full-range node produces
          byte-identical output to calling Engine::forward() directly.
          Validates that the pipeline abstraction introduces no numerical
          divergence.

      - name: two-node-split
        status: implemented
        description: |
          A 2-node pipeline (e.g. [0,2) + [2,4)) produces valid logits.
          Each node has its own KvCacheManager with layer count matching
          its range. Tested with both symmetric and asymmetric splits.

      - name: three-node-split
        status: implemented
        description: |
          A 3-node pipeline (e.g. [0,1) + [1,3) + [3,4)) produces valid
          logits, validating middle-node activation pass-through.

      - name: multi-step-decode-through-split
        status: implemented
        description: |
          50 consecutive decode steps through a 2-node split pipeline
          complete without error. Validates that KV cache state is
          maintained correctly across multiple forward passes with
          split nodes and that positions advance correctly.

      - name: gpu-split-equivalence
        status: implemented
        description: |
          The critical Phase 2 correctness property: a split pipeline produces
          numerically identical logits to monolithic execution on real GPU
          hardware. Tested with CUDA backend using random-weight models:
          - 2-node symmetric split (prefill): [0,1) + [1,2) on 2-layer model
          - 2-node split with decode: prefill + 5 decode steps match monolithic
          - Asymmetric split: [0,1) + [1,4) on 4-layer model
          Uses forward_node() on a single engine with different NodeConfigs,
          sharing GPU tensor memory. Logits compared within FP16 tolerance (1e-4).

      - name: pipeline-ipc
        status: implemented
        description: |
          Unix domain socket IPC for multi-process pipeline communication.
          Activation tensors serialized as [ndim][shape][dtype][raw data]
          with GPU->CPU->socket->CPU->GPU copy path. IpcNodeClient implements
          ComputeNode over a socket, so PipelineCoordinator transparently chains
          in-process and cross-process nodes. Validated: IPC split matches
          in-process split for prefill and multi-step decode.

  # ============================================================
  # SAMPLING
  # ============================================================
  - name: Sampling
    path: crates/fracture-generate/src
    status: implemented
    description: |
      Token selection from logit distributions. Runs on CPU.
      Supports temperature scaling, top-k, top-p, and greedy determinism.
    shared: [error-handling]
    behaviors:
      - name: temperature-scaling
        status: implemented
        description: |
          Divides logits by temperature before softmax. Temperature=0 produces
          argmax (greedy) selection. Temperature=1.0 leaves distribution unchanged.
          Higher temperatures flatten the distribution. Negative temperatures
          invert the distribution (lowest-logit token becomes most probable);
          the implementation does not validate temperature >= 0.
          test_temperature_scaling_through_sampler calls Sampler::sample directly
          at temp=0.5 (sharp) and temp=5.0 (flat) to verify the actual sampler
          path, not a manual replication of the math.
          test_negative_temperature_inverts_distribution documents the inversion
          behavior with temp=-1.0.

      - name: top-k-filtering
        status: implemented
        description: |
          Keeps only the K highest logits, setting all others to -inf before
          softmax. K=1 is equivalent to greedy. K=vocab_size disables filtering.
          K=0 disables filtering.

      - name: top-p-filtering
        status: implemented
        description: |
          After softmax, sorts tokens by probability descending and keeps the
          smallest set whose cumulative probability exceeds top_p. top_p=1.0
          disables filtering. top_p=0.0 keeps only the most probable token.

      - name: greedy-determinism
        status: implemented
        description: |
          With temperature=0 (or temperature=1 with top_k=1), the same logits
          always produce the same token. No randomness involved.

      - name: combined-filtering
        status: implemented
        description: |
          Top-K is applied before top-P. The filters compose correctly:
          top_k=50, top_p=0.9 first restricts to 50 tokens then further
          restricts by cumulative probability.

      - name: softmax-correctness
        status: implemented
        description: |
          The softmax step that converts logits to probabilities uses the
          numerically stable form: subtract the maximum logit before
          exponentiation to prevent overflow. The resulting probabilities
          form a valid distribution (sum to 1.0). This is applied after
          top-K filtering and before top-P filtering.

      - name: weighted-random-selection
        status: implemented
        description: |
          After top-K filtering, softmax, and top-P filtering produce a valid
          probability distribution, a token is drawn via weighted random
          sampling from that distribution. A uniform random value is generated
          and used to select a token proportional to its probability via
          cumulative sum traversal.

      - name: nan-inf-logit-handling
        status: implemented
        description: |
          When the logit vector contains NaN or Inf values (from model
          divergence or weight corruption), the sampler detects them and
          returns an error rather than producing undefined behavior.
          Softmax on NaN input produces NaN probabilities, making weighted
          sampling undefined.

      - name: single-logit-vocab
        status: implemented
        description: |
          When the logit vector has only one element (degenerate vocab_size=1),
          sampling always returns token 0 regardless of temperature/top-k/top-p
          settings. Validates filtering and softmax don't crash on minimal input.

      - name: seeded-reproducibility
        status: implemented
        description: |
          With temperature > 0, providing the same random seed produces the
          same token sequence. Without a seed, sampling is non-deterministic.
          Requires accepting an optional seed parameter and using it to
          initialize the RNG for reproducible generation.

  # ============================================================
  # GENERATION LOOP
  # ============================================================
  - name: Generation Loop
    path: crates/fracture-generate/src
    status: implemented
    description: |
      Orchestrates the generation pipeline: prefill, decode loop, and
      streaming. Accepts pre-tokenized input — tokenization and
      detokenization are handled by the server layer via the tokenizers
      crate. Emits per-request metrics (TTFT, tokens/sec, VRAM usage)
      to stderr as JSON.
    shared: [error-handling]
    dismissed:
      - suggestion: non-greedy-sampling
        reason: temperature/top-k/top-p behavior is fully specified in the Sampling section; the generation loop just calls the sampler
      - suggestion: temperature-sampling
        reason: same as non-greedy-sampling; sampling behavior is in the Sampling section
      - suggestion: error-handling
        reason: shared behavior reference for interface contract, not a standalone behavior to remove
      - suggestion: max-tokens-zero
        reason: already covered by request-validation in HTTP Request Processing which rejects max_tokens=0
    behaviors:
      - name: prefill-to-decode-transition
        status: implemented
        description: |
          After prefill, the generation loop correctly transitions to decode mode.
          The first decode step uses the sampled token from prefill logits as input.
          Position tracking increments correctly from prompt length.
          KV cache state is consistent between prefill and first decode.

      - name: stop-conditions
        status: implemented
        description: |
          Generation stops on: EOS token (128001 or 128008 or 128009 for Llama 3),
          or max_tokens reached. The stop token itself is not included in the output.
          Cache is always freed on completion, even on error.

      - name: greedy-golden-output
        status: implemented
        description: |
          Greedy generation (temperature=0) on known prompts produces token
          sequences matching PyTorch reference output. This is the top-level
          end-to-end correctness property: prefill, sample, decode loop, and
          stop must produce the expected tokens. Individual kernel and forward-pass
          numerical correctness are necessary but not sufficient — this validates
          the full pipeline including sampling, position tracking, and KV cache
          interaction across multiple decode steps.

      - name: token-streaming
        status: implemented
        description: |
          Each generated token is sent through the output channel immediately
          after generation, not buffered until completion. The channel is
          a tokio unbounded mpsc channel that the HTTP layer reads from.

      - name: request-metrics
        status: implemented
        description: |
          Emits RequestMetrics as JSON to stderr after each generation request.
          Tracks: time-to-first-token (TTFT), total generation time, tokens/sec,
          average decode step latency, peak VRAM usage, and KV cache occupancy.

      - name: generation-cancellation
        status: implemented
        description: |
          The generation loop supports cooperative cancellation via a shared
          Arc<AtomicBool> cancel flag checked at the start of each decode
          iteration. When cancelled, the decode loop exits early with
          StopReason::Stop and the KV cache is freed.
          test_cancellation_pre_start verifies that a flag set before calling
          generate_with_cancel causes immediate exit after the prefill token.
          test_cancellation_mid_generation uses CancellingMockBackend to set
          the flag after N logit readbacks and verifies partial results are
          returned with StopReason::Stop and cache freed.

      - name: prompt-exceeds-max-seq-len
        status: implemented
        description: |
          When the tokenized prompt length exceeds max_seq_len, the generation
          loop returns a clear error before attempting prefill rather than
          failing deep in cache append. Returns a meaningful "prompt too long"
          error with the actual vs maximum lengths.

      - name: empty-prompt-handling
        status: implemented
        description: |
          When given zero tokens as input (empty prompt after tokenization),
          the generation loop returns a clear error rather than attempting
          prefill with an empty tensor.

      - name: stop-reason-reporting
        status: implemented
        description: |
          The generation loop reports why it stopped (EOS token hit vs
          max_tokens reached) so the server layer can set the correct
          finish_reason ('stop' vs 'length') in the OpenAI-compatible
          response.

      - name: max-tokens-one
        status: implemented
        description: |
          When max_tokens=1, the generation loop performs prefill, samples
          exactly one token from the logits, and returns it without entering
          the decode loop. Returns finish_reason 'length'.

  # ============================================================
  # HTTP SERVER — ENDPOINTS
  # ============================================================
  - name: HTTP Server Endpoints
    path: crates/fracture-server/src
    status: implemented
    description: |
      OpenAI-compatible HTTP route handlers for completions, chat,
      model listing, profiling, and health checks.
    shared: [error-handling]
    dismissed:
      - suggestion: response-finish-reason
        reason: already covered by finish-reason-reporting in HTTP Request Processing and streaming-finish-reason in HTTP Streaming
      - suggestion: stop-sequence-support
        reason: stop sequences not implemented; this is a feature request, not a missing behavior
      - suggestion: finish-reason-field
        reason: already covered by finish-reason-reporting in HTTP Request Processing
      - suggestion: unknown-model-error
        reason: already covered by model-name-validation in HTTP Request Processing
      - suggestion: unknown-route-handling
        reason: axum default 404 behavior; not a project-specific behavior
      - suggestion: model-not-found
        reason: already covered by model-name-validation in HTTP Request Processing
      - suggestion: completions-stop-sequences
        reason: stop sequences not implemented; feature request
      - suggestion: chat-completions-stop-sequences
        reason: stop sequences not implemented; feature request
      - suggestion: streaming-usage-field
        reason: already covered by streaming-usage-stats in HTTP Server Streaming
      - suggestion: response-id-and-metadata
        reason: covered by non-streaming-format-compliance in HTTP Server Streaming
      - suggestion: finish-reason
        reason: already covered by finish-reason-reporting in HTTP Request Processing
    behaviors:
      - name: completions-endpoint
        status: implemented
        description: |
          POST /v1/completions accepts JSON with model, prompt, max_tokens,
          temperature, top_p, top_k, and stream fields. Returns JSON response
          with choices array containing generated text. Tokenizes the prompt
          via the tokenizers crate. Returns 400 on malformed requests.

      - name: chat-completions-endpoint
        status: implemented
        description: |
          POST /v1/chat/completions accepts messages array with role/content
          objects. Applies Llama 3 chat template to convert messages to prompt.
          Returns response in chat completion format with message object.

      - name: models-endpoint
        status: implemented
        description: |
          GET /v1/models returns the list of loaded models in OpenAI-compatible
          format. Returns a JSON object with a data array containing model
          objects with id, object, created, and owned_by fields. Required by
          client libraries to discover available models.

      - name: profile-endpoint
        status: implemented
        description: |
          GET /v1/profile returns profiling status. Currently returns a
          placeholder JSON object indicating the profiling endpoint is ready.
          Will return RequestMetrics and aggregated stats once the profiling
          pipeline is fully wired through shared state.

      - name: health-endpoint
        status: implemented
        description: |
          GET /health returns server readiness status. Returns 200 with
          {"status": "ready"} when the model is loaded and ready to serve.
          Enables load balancer and orchestration health checks.

      - name: error-response-format
        status: implemented
        description: |
          Error responses (400, 500, etc.) return the standard OpenAI error
          object format: {"error": {"message": "...", "type": "invalid_request_error", "code": null}}.
          Client libraries depend on the nested object structure for error handling.

      - name: completions-streaming
        status: implemented
        description: |
          When stream=true on POST /v1/completions, the response is sent
          as Server-Sent Events with chunked completion objects, ending
          with a [DONE] sentinel.

      - name: chat-completions-streaming
        status: implemented
        description: |
          When stream=true on POST /v1/chat/completions, the response is
          sent as Server-Sent Events with chunked chat completion delta
          objects containing role/content fragments, ending with a [DONE]
          sentinel.

      - name: response-usage-field
        status: implemented
        description: |
          Non-streaming responses from /v1/completions and /v1/chat/completions
          include a usage object with prompt_tokens, completion_tokens, and
          total_tokens fields.

      - name: chat-completions-request-validation
        status: implemented
        description: |
          POST /v1/chat/completions returns 400 on malformed requests:
          missing or empty messages array, messages missing required role
          or content fields, invalid role values.

  # ============================================================
  # HTTP SERVER — REQUEST PROCESSING
  # ============================================================
  - name: HTTP Server Request Processing
    path: crates/fracture-server/src
    status: implemented
    description: |
      Tokenization, request validation, chat template application,
      model name checking, and usage stats for the HTTP API.
    shared: [error-handling]
    dismissed:
      - suggestion: streaming-sse-responses
        reason: redundant with sse-streaming and sse-event-format-compliance in HTTP Server Streaming section
      - suggestion: custom-stop-sequences
        reason: stop sequences not implemented; feature request, not a missing behavior
      - suggestion: streaming-responses
        reason: same as streaming-sse-responses; covered by HTTP Server Streaming section
      - suggestion: response-body-format
        reason: covered by non-streaming-format-compliance in HTTP Server Streaming section
      - suggestion: stop-sequences
        reason: stop sequences not implemented; feature request, not a missing behavior
      - suggestion: stop-sequence-handling
        reason: stop sequences not implemented; feature request
    behaviors:
      - name: tokenizer-loading
        status: implemented
        description: |
          Loads a HuggingFace tokenizer.json file for BPE tokenization and
          detokenization. Searches for tokenizer.json in the same directory
          as the model GGUF file, or accepts an explicit --tokenizer CLI
          path. Fails with a clear error if no tokenizer is found. The
          tokenizer file must be placed alongside the model — it is not
          embedded in the GGUF format.

      - name: request-validation
        status: implemented
        description: |
          Returns 400 for: empty prompt/messages, negative temperature,
          top_p outside [0, 1], max_tokens=0. Content-type validation
          is handled by axum's Json extractor (rejects non-JSON bodies).

      - name: chat-template
        status: implemented
        description: |
          Applies the Llama 3 chat template correctly. System messages are
          wrapped in the appropriate header tags. User and assistant messages
          alternate with correct delimiters. The template output matches
          what HuggingFace tokenizer.apply_chat_template produces.

      - name: model-name-validation
        status: implemented
        description: |
          When a request specifies a model name that doesn't match the loaded
          model, the server returns 404 with an OpenAI-compatible error object.
          If model is None, the request proceeds normally. Prevents confusion
          when clients target a specific model that isn't available.

      - name: usage-stats-accuracy
        status: implemented
        description: |
          Non-streaming responses include a usage object with prompt_tokens,
          completion_tokens, and total_tokens that accurately reflect the
          actual tokenized prompt length and number of generated tokens
          (total = prompt + completion). Clients and billing systems depend
          on these counts being exact.

      - name: concurrent-requests
        status: implemented
        description: |
          Multiple simultaneous generation requests are handled correctly,
          each with independent KV cache and generation state. One request
          completing or erroring does not affect others in flight. Phase 1
          uses a shared Mutex on the KV cache manager, limiting to sequential
          request processing. True concurrent serving requires Phase 4
          continuous batching.

      - name: finish-reason-reporting
        status: implemented
        description: |
          Responses include a finish_reason field indicating why generation
          stopped: "stop" when the EOS token is produced, "length" when
          max_tokens is reached.

      - name: max-tokens-default
        status: implemented
        description: |
          When max_tokens is omitted from the request, the server applies
          a sensible default. request-validation rejects max_tokens=0 but
          does not specify behavior when the field is absent.

  # ============================================================
  # HTTP SERVER — STREAMING
  # ============================================================
  - name: HTTP Server Streaming
    path: crates/fracture-server/src
    status: implemented
    description: |
      Server-Sent Events streaming for token-by-token output,
      non-streaming response mode, and streaming lifecycle management.
    shared: [error-handling]
    behaviors:
      - name: sse-streaming
        status: implemented
        description: |
          When stream=true, returns text/event-stream content type. Sends
          data: {json}\n\n for each token. Sends data: [DONE]\n\n at end.
          Each SSE event contains a delta object with the new token content.
          Generation runs in a spawn_blocking task, tokens streamed via
          async_stream.

      - name: sse-event-format-compliance
        status: implemented
        description: |
          Each SSE data event contains a JSON object matching OpenAI's
          streaming chunk format: id, object='chat.completion.chunk', created,
          model, and choices array with delta containing content. Client
          libraries parse this exact structure.

      - name: non-streaming
        status: implemented
        description: |
          When stream=false (default), waits for full generation to complete
          and returns the complete response in a single JSON object.
          Includes usage stats (prompt_tokens, completion_tokens, total_tokens).

      - name: streaming-usage-stats
        status: implemented
        description: |
          When stream=true, the final SSE chunk before [DONE] includes a
          usage object with prompt_tokens, completion_tokens, and total_tokens,
          matching OpenAI API behavior. Streaming clients also need token
          counts for billing and monitoring.

      - name: streaming-error-propagation
        status: implemented
        description: |
          When generation fails mid-stream (e.g., GPU OOM during decode),
          the server communicates the error to the client over the already-open
          SSE connection. Since HTTP status is already 200, the server sends
          an SSE event with an error payload before closing the stream, so
          clients can distinguish failure from truncated output.

      - name: stream-cancellation
        status: implemented
        description: |
          When a client disconnects during SSE streaming, the server detects
          the closed connection, aborts the in-flight generation, and frees
          associated resources (KV cache). Without this, disconnected clients
          cause the server to generate tokens into the void, wasting GPU
          compute and leaking cache memory.

      - name: non-streaming-format-compliance
        status: implemented
        description: |
          Non-streaming responses match OpenAI's chat.completion format:
          id, object, created, model, and choices array where each choice
          contains a message object (role, content) and a finish_reason.

      - name: streaming-finish-reason
        status: implemented
        description: |
          The final content-bearing SSE chunk includes finish_reason ('stop'
          when a stop token is hit, 'length' when max_tokens is reached)
          in the choices array.

      - name: non-streaming-error-response
        status: implemented
        description: |
          When generation fails during a non-streaming request (e.g., GPU
          OOM), the server returns an appropriate HTTP error status code
          and an error JSON body matching OpenAI's error format.

  # ============================================================
  # WIRE PROTOCOL (Phase 3)
  # ============================================================
  - name: Wire Protocol
    path: crates/fracture-protocol/src
    status: implemented
    description: |
      Custom binary wire protocol for distributed inference. TCP transport
      with persistent connections, CRC32C integrity checking, and bincode
      payload serialization. Supports 12 message types for registration,
      forward pass (single + batched), cache management, heartbeat, and
      error handling.
    shared: [error-handling]
    behaviors:
      - name: frame-encoding
        status: implemented
        description: |
          Encodes/decodes 16-byte frame headers (magic 0x4652, version,
          message type, sequence ID, payload length) with 4-byte CRC32C
          trailer. All multi-byte integers are big-endian. Validates magic,
          version, and payload size limits (256 MB max) on decode. CRC32C
          is computed over header + payload and verified on receive.

      - name: payload-size-limit-enforcement
        status: implemented
        description: |
          Frames with payload_length exceeding 256 MB are rejected on decode
          before attempting to allocate memory. Without this, a malformed or
          malicious frame header could cause the receiver to attempt a
          multi-gigabyte allocation.

      - name: message-payload-roundtrip
        status: implemented
        description: |
          Every message payload struct (RegisterPayload, RegisterAckPayload,
          ForwardPayload, ForwardResultPayload, HeartbeatPayload,
          HeartbeatAckPayload, CacheAllocPayload, ErrorPayload) survives
          bincode serialize → deserialize with all fields preserved exactly.
          ForwardPayload round-trips both TokenIds and Activations variants.
          ForwardResultPayload round-trips both Logits and Activations
          variants. Unknown MessageType byte values are rejected with a
          Protocol error.

      - name: tensor-header-roundtrip
        status: implemented
        description: |
          Encoding a TensorWireHeader (ndim, shape, dtype, compression,
          data_len) and decoding it back produces identical values. Roundtrip
          preserves all fields exactly for all DType variants (FP16, FP32,
          BF16, INT8, INT4) and arbitrary shapes (1D, 2D, 3D). Unsupported
          compression values (non-zero) are rejected on decode. Header bytes
          use big-endian encoding verified by byte-level inspection tests.

      - name: framed-connection
        status: implemented
        description: |
          Async TCP connection abstraction using tokio BufReader/BufWriter
          over split TcpStream halves. Provides send (bincode serialize +
          frame), send_raw (pre-serialized payload), send_empty (no payload),
          and recv (frame decode + CRC verify). Handles partial reads via
          read_exact. Detects closed connections.

      - name: crc-integrity
        status: implemented
        description: |
          CRC32C checksum computed over frame header + payload bytes using
          hardware-accelerated SSE4.2 instructions (crc32c crate). Verified
          on every received frame. Corrupted frames produce a Protocol error
          with the expected vs actual CRC values.

      - name: empty-payload-message-framing
        status: implemented
        description: |
          CacheFree and Shutdown are empty-payload message types. They are
          correctly encoded with the right message type byte, seq_id in
          the frame header carries the cache sequence identifier for
          CacheFree, and they decode to the correct message type on receive.

      - name: batched-forward-wire-messages
        status: implemented
        description: |
          BatchedForward (0x0C) and BatchedForwardResult (0x0D) message
          types carry batched inference payloads. BatchedForwardPayload
          contains per-sequence SequenceMetadataWire (seq_id, positions,
          block_table, cache_seq_len, last_block_tokens) plus concatenated
          input (TokenIds or Activations). BatchedForwardResultPayload
          returns per-sequence logits (tail) or activations (intermediate)
          with logit_offsets for splitting.

      - name: heartbeat-free-blocks
        status: implemented
        description: |
          HeartbeatAckPayload includes a free_blocks field reporting the
          number of available blocks in the worker's paged KV cache pool.
          Defaults to 0 via serde(default) for backward compatibility
          with workers that predate paged cache support.

  # ============================================================
  # SCHEDULER (Phase 3)
  # ============================================================
  - name: Scheduler
    path: crates/fracture-coordinator/src
    status: implemented
    description: |
      Layer assignment scheduler for distributed pipeline-parallel inference.
      Pure function with no networking or side effects. Takes worker
      capabilities and model config, returns optimal layer assignments.
      Three modes: Auto (compute-balanced with slow-node pruning),
      EqualSplit (for correctness testing), Manual (explicit override).
    shared: [error-handling]
    dismissed:
      - suggestion: scheduler-pipeline-ordering
        reason: ordering is an implementation detail of the auto-mode algorithm, implicitly covered by scheduler-auto-mode
      - suggestion: scheduler-pipeline-latency-model
        reason: implementation detail of scheduler-node-pruning; the pruning formula is part of the algorithm, not a separate behavior
      - suggestion: scheduler-head-tail-overhead-placement
        reason: implementation detail of scheduler-memory-estimation; already described in that behavior
      - suggestion: scheduler-manual-mode-out-of-bounds-layers
        reason: manual mode already validates full coverage of [0, num_layers) per scheduler-manual-mode; out-of-bounds is implicitly caught by coverage validation
    behaviors:
      - name: scheduler-auto-mode
        status: implemented
        description: |
          Compute-balanced layer assignment. Calculates relative speed from
          measured decode_ms_per_layer, assigns layers proportional to speed,
          clamps to memory ceilings (accounting for head/tail overhead),
          redistributes remainder to fastest nodes. Reports imbalance ratio
          and identifies bottleneck node.

      - name: scheduler-node-pruning
        status: implemented
        description: |
          Iteratively removes the slowest node if removing it reduces total
          pipeline latency (including network hop overhead). Keeps slow nodes
          when their memory is needed to fit the model. Logs exclusion
          reasons with latency comparisons.

      - name: scheduler-equal-split
        status: implemented
        description: |
          Forces equal layer count per node regardless of compute speed.
          Distributes remainder layers to nodes with most available memory.
          Validates each node can hold its assignment within memory ceiling.

      - name: scheduler-manual-mode
        status: implemented
        description: |
          Applies explicit layer range assignments. Validates full coverage
          of [0, num_layers) with no gaps or overlaps. Validates each node
          has sufficient memory. Returns error for unknown node IDs.

      - name: scheduler-memory-estimation
        status: implemented
        description: |
          Estimates per-layer memory (weights + KV cache) from ModelConfig.
          Accounts for head overhead (embedding table ~1 GB) and tail
          overhead (LM head ~1 GB). Clamps ideal layer counts to what
          each node can physically hold.

      - name: scheduler-insufficient-capacity
        status: implemented
        description: |
          Returns an error when total cluster memory cannot hold the model
          at the configured max_seq_len. Error message includes the number
          of layers that could be assigned vs the total needed.

      - name: scheduler-single-node
        status: implemented
        description: |
          When only one worker is registered, all three modes (Auto,
          EqualSplit, Manual) assign all layers to that single worker.
          Auto mode's pruning logic does not prune the last remaining node.

      - name: scheduler-zero-workers
        status: implemented
        description: |
          Returns an error when the worker list is empty. All three modes
          (Auto, EqualSplit, Manual) fail with a descriptive error rather
          than returning an empty assignment.

      - name: scheduler-contiguous-layer-ranges
        status: implemented
        description: |
          Auto and EqualSplit modes produce contiguous, non-overlapping
          layer ranges per node. No node receives a fragmented set of
          layers.

      - name: scheduler-equal-split-node-overflow
        status: implemented
        description: |
          When EqualSplit finds a node cannot hold its equal share of layers
          but total cluster memory is sufficient, returns an error rather
          than silently reassigning layers.

      - name: scheduler-auto-mode-invalid-metrics
        status: implemented
        description: |
          When a node's decode_ms_per_layer is zero or negative, Auto mode
          returns an error rather than producing nonsensical assignments
          from division by zero or negative speeds.

      - name: scheduler-manual-mode-duplicate-node-ids
        status: implemented
        description: |
          Manual mode returns an error when the same node ID appears in
          multiple entries in the explicit assignment list, rather than
          silently producing ambiguous assignments.

  # ============================================================
  # PEER REGISTRY (Phase 3)
  # ============================================================
  - name: Peer Registry
    path: crates/fracture-coordinator/src
    status: implemented
    description: |
      Tracks connected workers: capabilities, connection handles, layer
      assignments, health state, and heartbeat timestamps.
    shared: [error-handling]
    dismissed:
      - suggestion: worker-enumeration
        reason: pipeline_order() provides filtered enumeration of Ready workers; generic list-all over-specifies an internal data structure
      - suggestion: worker-deregistration
        reason: workers transition to Dead via heartbeat timeout; no explicit deregistration mechanism exists or is architecturally needed
    behaviors:
      - name: worker-registration
        status: implemented
        description: |
          Registers workers with capabilities and connection handle.
          Rejects duplicate registrations for active workers. Allows
          re-registration of dead workers (reconnection after failure).

      - name: worker-health-tracking
        status: implemented
        description: |
          Records heartbeat timestamps and paged cache stats (free_blocks).
          check_heartbeats() returns node IDs that have exceeded the
          timeout. mark_dead() transitions workers to Dead status.
          Pipeline order only includes Ready workers with assignments.

      - name: distributed-admission-control
        status: implemented
        description: |
          min_free_blocks() returns the minimum free block count across
          all Ready pipeline workers. The distributed scheduler uses this
          as the effective memory constraint: the bottleneck worker
          determines admission capacity. Dead workers are excluded.

      - name: layer-assignment-storage
        status: implemented
        description: |
          Stores layer range assignments for registered workers and
          provides pipeline-ordered retrieval. assign() records a
          worker's LayerAssignment and transitions it to Ready status.
          pipeline_order() returns worker node IDs sorted by layer
          range start, filtered to only Ready workers with assignments.
          Dead workers are excluded from pipeline order.

      - name: worker-status-transitions
        status: implemented
        description: |
          Workers transition through defined states (registered → ready →
          dead). Only valid transitions are allowed: a Dead worker cannot
          be marked Ready without re-registration. assign() on a Dead
          worker returns an error.

      - name: worker-lookup
        status: implemented
        description: |
          Retrieves a registered worker's connection handle, capabilities,
          and current status by node ID. Returns an error for unknown
          node IDs.

      - name: layer-reassignment
        status: implemented
        description: |
          Defines behavior when assign() is called on a worker that already
          has a layer assignment (already in Ready status). Either overwrites
          the previous assignment or rejects the call with an error.

  # ============================================================
  # SEQUENCE STATE (Phase 3)
  # ============================================================
  - name: Sequence State
    path: crates/fracture-coordinator/src
    status: implemented
    description: |
      Per-sequence lifecycle tracking: status transitions, position
      tracking, generated token accumulation, and cache allocation
      tracking across workers.
    shared: [error-handling]
    behaviors:
      - name: sequence-lifecycle
        status: implemented
        description: |
          Sequences transition: Prefilling → Decoding → Complete/Error.
          Invalid transitions (e.g., Complete → Decoding) return errors.
          Tokens can only be recorded in Decoding state. Position advances
          with each recorded token. Token limit checked via is_at_limit().

      - name: sequence-cache-tracking
        status: implemented
        description: |
          Each sequence records which worker node IDs have active KV cache
          allocations. Used by the coordinator to send CacheFree messages
          to all relevant workers when a sequence completes or errors.

      - name: sequence-position-accuracy
        status: implemented
        description: |
          After prefill with N tokens, position starts at N. Each decode
          step advances position by 1. get_position() always returns the
          correct next position for RoPE. Off-by-one here would cause
          wrong positional embeddings for every decode token.

      - name: sequence-creation
        status: implemented
        description: |
          Creating a new sequence with prompt tokens initializes it in
          Prefilling state with position set to prompt_len (the first
          decode position), empty generated tokens, and empty cache
          tracking. No input validation is performed at construction —
          the caller is responsible for providing valid prompt_len and
          max_tokens values.

      - name: sequence-token-retrieval
        status: implemented
        description: |
          Accumulated generated tokens can be retrieved from a sequence.
          The returned token list reflects all tokens recorded during
          Decoding in order.

      - name: sequence-error-transition
        status: implemented
        description: |
          A sequence can transition to the Error state from Prefilling or
          Decoding with an error reason. Once in Error state, no further
          state transitions or token recording are possible.

      - name: sequence-prefill-to-decode-transition
        status: implemented
        description: |
          An explicit operation marks prefill as complete, transitioning
          from Prefilling to Decoding and setting the initial position to
          the prompt token count. Attempting this transition from any state
          other than Prefilling returns an error.

      - name: sequence-completion-transition
        status: implemented
        description: |
          An explicit operation transitions a sequence from Decoding to
          Complete. Attempting this from any state other than Decoding
          returns an error. Once in Complete state, no further state
          transitions or token recording are possible.

  # ============================================================
  # DISTRIBUTED PIPELINE (Phase 3)
  # ============================================================
  - name: Distributed Pipeline
    path: [crates/fracture-coordinator/src, crates/fracture-coordinator/tests]
    status: implemented
    description: |
      Orchestrates forward passes across distributed workers. Sends
      Forward messages sequentially through workers in layer-range order,
      passing activation tensors through the coordinator between stages.
      Supports both single-sequence (Forward) and batched (BatchedForward)
      paths.
    shared: [error-handling]
    behaviors:
      - name: pipeline-forward
        status: implemented
        description: |
          Sends token IDs to head worker, chains activation tensors through
          intermediate workers, returns logits from tail worker. Validates
          that intermediate workers return activations (not logits) and
          the tail worker returns logits (not activations).

      - name: pipeline-batched-forward
        status: implemented
        description: |
          Sends BatchedForwardPayload with per-sequence metadata through
          the pipeline. Each worker processes the batch with paged attention
          and returns BatchedForwardResultPayload. Coordinator chains
          activations between stages and splits per-sequence logits from
          the tail worker. Gracefully handles workers responding with
          non-batched ForwardResult as a fallback.

      - name: pipeline-batched-forward-validation
        status: implemented
        description: |
          Distributed batched forward produces correct per-sequence logits
          through a multi-node pipeline with mock workers. Verified:
          two-node pipeline with multiple sequences returns independent
          logits for each, single-sequence batch works, single-node
          (head+tail) pipeline works, missing cache produces clear error.

      - name: distributed-cache-lifecycle
        status: implemented
        description: |
          alloc_cache() sends CacheAlloc to all pipeline workers for a
          new sequence. free_cache() sends CacheFree to all workers.
          The coordinator is the single source of truth for cache state.

      - name: activation-shape-validation
        status: implemented
        description: |
          When an intermediate worker returns activation tensors, the
          coordinator validates the last dimension matches hidden_size
          before forwarding to the next worker. A shape mismatch (e.g.,
          worker returns [1, 8192] but model expects hidden_size=4096)
          produces a clear error identifying the worker and dimensions.

      - name: pipeline-error-propagation
        status: implemented
        description: |
          If a worker returns an Error message instead of ForwardResult,
          the pipeline propagates the error with the worker ID and error
          details. Unexpected message types also produce Protocol errors.

      - name: partial-cache-alloc-rollback
        status: implemented
        description: |
          When alloc_cache() sends CacheAlloc to all pipeline workers and
          allocation fails on one worker (e.g., GPU OOM) but succeeds on
          others, the coordinator frees the successfully-allocated caches
          on the other workers to avoid memory leaks.

      - name: pipeline-single-worker
        status: implemented
        description: |
          A distributed pipeline with a single worker (head+tail) functions
          correctly: token IDs in, logits out, no activation chaining.
          Validates the coordinator handles the degenerate case without
          intermediate forwarding steps.

      - name: forward-without-cache
        status: implemented
        description: |
          Calling pipeline-forward for a sequence ID that has not had
          alloc_cache() called produces a clear error, rather than silently
          sending to workers with no cache state.

      - name: worker-layer-coverage-validation
        status: implemented
        description: |
          The coordinator validates that the workers' layer ranges cover
          all model layers contiguously without gaps or overlaps. A
          misconfigured pipeline produces a clear error at construction.

      - name: duplicate-cache-alloc
        status: implemented
        description: |
          Calling alloc_cache() for a sequence ID that already has an active
          cache produces a clear error rather than silently allocating a
          second cache or overwriting existing state.

      - name: free-unknown-sequence
        status: implemented
        description: |
          Calling free_cache() for a sequence ID that was never allocated
          or was already freed produces a clear error rather than sending
          spurious CacheFree messages to workers.

      - name: cache-reuse-after-free
        status: implemented
        description: |
          Calling alloc_cache() for a sequence ID that was previously
          allocated and then freed succeeds, allowing sequence IDs to be
          reused across the cache lifecycle.

      - name: multiple-sequence-isolation
        status: implemented
        description: |
          Multiple sequences with independently allocated caches can be
          forwarded through the pipeline without interfering with each
          other. A forward for sequence A uses sequence A's cache state,
          not sequence B's.

  # ============================================================
  # WORKER BINARY (Phase 3)
  # ============================================================
  - name: Worker Binary
    path: bins/fracture-worker-cuda/src
    status: implemented
    description: |
      CUDA worker process that connects to coordinator, benchmarks GPU,
      registers with calibration data, receives layer assignment, loads
      weights, and serves Forward/BatchedForward/Cache/Heartbeat requests.
      Maintains both contiguous and paged KV caches for single-sequence
      and batched inference paths.
    shared: [error-handling]
    covered:
      - behavior: worker-calibration
        reason: tested via e2e binary spawn in bins/fracture-coordinator-cuda/tests/e2e.rs (test_e2e_worker_lifecycle)
      - behavior: worker-registration-handshake
        reason: tested via e2e binary spawn in bins/fracture-coordinator-cuda/tests/e2e.rs (test_e2e_worker_lifecycle, test_e2e_inference_pipeline)
      - behavior: worker-serve-loop
        reason: tested via e2e binary spawn (test_e2e_inference_pipeline exercises Forward/CacheAlloc/CacheFree) and mock protocol workers in crates/fracture-coordinator/tests/distributed_pipeline.rs
      - behavior: worker-batched-forward-handler
        reason: protocol-level behavior tested via mock workers in crates/fracture-coordinator/tests/distributed_pipeline.rs (test_batched_forward_*); actual worker binary exercises same code path
      - behavior: worker-heartbeat-free-blocks
        reason: protocol field tested in crates/fracture-coordinator/src/heartbeat.rs and registry.rs unit tests (test_record_heartbeat_updates_timestamp, test_min_free_blocks_*)
    behaviors:
      - name: worker-calibration
        status: implemented
        description: |
          Runs 20 single-layer forward passes for decode (N=1) and prefill
          (N=128), discards first 5 (warmup), averages remaining 15. Uses
          a temporary CudaBackend instance that is dropped after calibration
          to reclaim GPU memory before loading assigned weights.

      - name: worker-calibration-plausibility
        status: implemented
        description: |
          Validates that calibration benchmark results are plausible:
          decode_ms_per_layer and prefill_ms_per_layer must be > 0 and
          <= 500 ms. Validated both in the worker (after calibration,
          before sending Register) and in the scheduler (before computing
          layer assignments). Implausible values produce a clear error
          identifying the worker and the offending metric.

      - name: worker-registration-handshake
        status: implemented
        description: |
          Connects to coordinator via TCP, sends Register with node_id,
          GPU model, memory stats, compute capability, and calibration
          benchmarks. Waits for RegisterAck with layer assignment and
          model config. Loads only assigned layer weights from GGUF.

      - name: worker-serve-loop
        status: implemented
        description: |
          Handles Forward (deserialize input, run forward pass, serialize
          output), CacheAlloc (allocate KV cache for seq_id), CacheFree
          (free KV cache), Heartbeat (echo with GPU stats), and Shutdown
          (graceful exit with cache cleanup). Unknown message types return
          Error with ProtocolViolation code.

      - name: worker-unknown-seq-id-handling
        status: implemented
        description: |
          When a worker receives a Forward or CacheFree for a seq_id it has
          no cache for (e.g., after a missed CacheAlloc or duplicate CacheFree),
          it returns an Error message rather than panicking or silently ignoring
          the request.

      - name: worker-duplicate-cache-alloc
        status: implemented
        description: |
          When a worker receives a CacheAlloc for a seq_id that already has
          an allocated KV cache, it returns an Error rather than silently
          overwriting or leaking the existing allocation.

      - name: worker-cache-alloc-oom
        status: implemented
        description: |
          When GPU memory is insufficient to fulfill a CacheAlloc request,
          the worker returns an Error message identifying the seq_id and
          available/required memory rather than crashing.

      - name: worker-paged-cache-init
        status: implemented
        description: |
          At startup, the worker creates a PagedKvCacheManager alongside the
          contiguous KV cache. Block pool is sized from available GPU memory
          minus a 512 MB scratch reserve. CacheAlloc allocates in both caches;
          CacheFree frees from both. Shutdown destroys the paged block pool.

      - name: worker-batched-forward-handler
        status: implemented
        description: |
          Handles BatchedForward messages by deserializing the payload,
          building SequenceSlice from SequenceMetadataWire (mapping seq_id
          to local paged CacheHandle), resolving input (token IDs for head,
          activations for middle/tail), calling batched_forward_node, and
          returning BatchedForwardResultPayload with logits or activations.

      - name: worker-heartbeat-free-blocks
        status: implemented
        description: |
          The heartbeat ack reports the paged cache's free block count via
          the free_blocks field. This enables the coordinator to make
          distributed admission control decisions based on worker memory.

  # ============================================================
  # COORDINATOR BINARY (Phase 3)
  # ============================================================
  - name: Coordinator Binary
    path: bins/fracture-coordinator-cuda/src
    status: implemented
    description: |
      CUDA coordinator process that accepts worker connections, runs the
      scheduler, assigns layers, builds the distributed pipeline, and
      serves an OpenAI-compatible HTTP API with async distributed generation.
    shared: [error-handling]
    dismissed:
      - suggestion: coordinator-model-config-loading
        reason: GGUF loading is covered by the GGUF Parser section; the coordinator just calls it
      - suggestion: coordinator-streaming-responses
        reason: streaming not implemented in coordinator; single-node server handles streaming
      - suggestion: coordinator-heartbeat-monitoring
        reason: fully covered by the Heartbeat Protocol section
      - suggestion: coordinator-scheduling-modes
        reason: scheduling modes are covered by the Scheduler section behaviors (auto, equal-split, manual)
      - suggestion: coordinator-readiness-timeout
        reason: coordinator-pipeline-build does not wait for readiness confirmation; workers are ready after RegisterAck
      - suggestion: streaming-distributed-generation
        reason: coordinator streaming not implemented; single-node server handles streaming
    covered:
      - behavior: coordinator-worker-acceptance
        reason: tested via e2e binary spawn in bins/fracture-coordinator-cuda/tests/e2e.rs (test_e2e_worker_lifecycle)
      - behavior: coordinator-scheduling
        reason: tested via e2e binary spawn (test_e2e_worker_lifecycle verifies pipeline becomes operational after scheduling)
      - behavior: coordinator-http-api
        reason: tested via e2e binary spawn in bins/fracture-coordinator-cuda/tests/e2e.rs (test_e2e_inference_pipeline exercises /health, /v1/models, /v1/completions)
      - behavior: coordinator-shutdown
        reason: tested via e2e ProcessGuard which kills coordinator and verifies clean exit
      - behavior: coordinator-pipeline-build
        reason: tested via e2e binary spawn (test_e2e_worker_lifecycle verifies pipeline is built and operational after scheduling)
      - behavior: coordinator-models-endpoint
        reason: tested via e2e binary spawn in bins/fracture-coordinator-cuda/tests/e2e.rs (test_e2e_inference_pipeline exercises /v1/models)
      - behavior: coordinator-scheduling-failure
        reason: scheduler error propagation tested by scheduler unit tests; coordinator uses ? to propagate
      - behavior: coordinator-worker-disconnect
        reason: connection error propagation tested via e2e; FramedConnection::recv returns IO error on disconnect
      - behavior: coordinator-concurrent-requests
        reason: serialization via Mutex<PeerRegistry> is structural; tested implicitly by e2e inference pipeline
    behaviors:
      - name: coordinator-worker-acceptance
        status: implemented
        description: |
          Listens for TCP connections from workers. Reads Register messages,
          records capabilities in the PeerRegistry, and waits until the
          expected number of workers have registered before proceeding.

      - name: coordinator-acceptance-timeout
        status: implemented
        description: |
          When fewer workers connect than expected within a configurable
          timeout (--acceptance-timeout, default 120s, 0=no timeout), the
          coordinator exits with an error reporting how many workers
          registered vs expected. Prevents the coordinator from hanging
          when workers fail to start or cannot reach the listen address.

      - name: coordinator-scheduling
        status: implemented
        description: |
          Runs the scheduler with registered worker capabilities and model
          config. Sends RegisterAck with layer assignments to each worker.
          Logs scheduler results including per-node assignments, imbalance
          ratio, bottleneck node, and any excluded nodes.

      - name: coordinator-http-api
        status: implemented
        description: |
          Serves OpenAI-compatible /v1/completions and /health endpoints.
          Tokenizes prompts, runs async generation through the distributed
          pipeline (prefill + decode loop with sampling), and returns
          JSON responses with usage stats. Validates prompt length against
          max_seq_len. Manages cache lifecycle (alloc before generation,
          free after, even on error).

      - name: coordinator-shutdown
        status: implemented
        description: |
          On SIGINT/Ctrl-C, sends Shutdown messages to all workers in the
          pipeline before exiting. Workers respond by freeing all caches
          and terminating.

      - name: coordinator-pipeline-build
        status: implemented
        description: |
          After scheduling completes and RegisterAck messages are sent, the
          coordinator assembles the distributed pipeline topology
          (DistributedPipeline::new) before starting the HTTP server.
          The pipeline validates contiguous layer ranges and records the
          pipeline order for subsequent forward passes.

      - name: coordinator-worker-disconnect
        status: implemented
        description: |
          When a worker disconnects unexpectedly during pipeline operation
          (e.g., crashes mid-generation), the coordinator detects the broken
          connection via IO error from FramedConnection::recv() and returns
          an HTTP 500 error to the in-flight request rather than hanging.

      - name: coordinator-concurrent-requests
        status: implemented
        description: |
          Multiple simultaneous HTTP requests are serialized at the pipeline
          level via Mutex<PeerRegistry>. Each forward pass acquires the
          registry lock, sends Forward to all workers, and releases it.
          Concurrent requests queue on the mutex and execute sequentially.

      - name: coordinator-scheduling-failure
        status: implemented
        description: |
          When the scheduler cannot assign all model layers to the available
          workers (e.g., insufficient collective VRAM), scheduler::schedule()
          returns an error which propagates via ? in main(), causing the
          coordinator to exit with the failure reason.

      - name: coordinator-models-endpoint
        status: implemented
        description: |
          The coordinator serves GET /v1/models listing available models
          in OpenAI-compatible format, matching the single-node server's
          models-endpoint behavior. Returns a JSON list with model id,
          object type, created timestamp, and owned_by fields.

  # ============================================================
  # HEARTBEAT PROTOCOL (Phase 3)
  # ============================================================
  - name: Heartbeat Protocol
    path: [crates/fracture-coordinator/src, crates/fracture-coordinator/tests]
    status: implemented
    description: |
      Coordinator-side heartbeat monitoring. Sends Heartbeat messages to
      all ready workers and checks for missed heartbeats to detect failures.
    shared: [error-handling]
    behaviors:
      - name: heartbeat-send-and-check
        status: implemented
        description: |
          send_heartbeats() sends Heartbeat with timestamp and nonce to all
          ready workers. Returns node IDs of workers that have exceeded the
          heartbeat timeout. mark_dead_workers() transitions timed-out
          workers to Dead status. Default interval is 5 seconds, default
          threshold is 3 missed heartbeats (15 seconds).

      - name: heartbeat-ack-validation
        status: implemented
        description: |
          When a worker responds to a Heartbeat, the coordinator validates
          the nonce in HeartbeatAck matches what was sent via
          HeartbeatTracker::process_ack(). A mismatched nonce (from a stale
          or replayed response) does not reset the heartbeat timer for that
          worker.

      - name: heartbeat-valid-ack-resets-timer
        status: implemented
        description: |
          When a valid HeartbeatAck (matching nonce) is received,
          HeartbeatTracker::process_ack() resets the missed-heartbeat
          counter to zero and updates the heartbeat timestamp in the
          registry.

      - name: heartbeat-dead-worker-ignored
        status: implemented
        description: |
          Once a worker is transitioned to Dead,
          HeartbeatTracker::process_ack() checks worker status and
          returns false for Dead workers. Subsequent HeartbeatAck
          messages are ignored and do not revive it or reset any counters.

  # ============================================================
  # END-TO-END VALIDATION (Phase 3)
  # ============================================================
  - name: Distributed Inference Validation
    path: [scripts, bins/fracture-coordinator-cuda/tests]
    status: implemented
    description: |
      End-to-end validation of distributed inference across machines.
      Covers the Phase 3 success criteria from the architecture document.
    dismissed:
      - suggestion: coordinator-failure-detection
        reason: workers don't run a heartbeat protocol toward the coordinator; the coordinator heartbeats workers, not the reverse
      - suggestion: layer-assignment-correctness
        reason: scheduler correctness is tested in the Scheduler section; e2e validation doesn't need to re-test the algorithm
      - suggestion: streaming-distributed-generation
        reason: coordinator streaming not implemented
    covered:
      - behavior: http-api-distributed-generation
        reason: tested via e2e binary spawn in bins/fracture-coordinator-cuda/tests/e2e.rs (test_e2e_inference_pipeline exercises /health, /v1/models, /v1/completions with usage stats)
    behaviors:
      - name: cross-machine-inference
        status: implemented
        description: |
          Two physical machines collaboratively run Llama 3 8B inference.
          Coordinator on one machine sends Forward messages over TCP to a
          worker on a different machine. Validated with RTX 5090 (coordinator)
          and RTX 3090 over WSL (worker) on a local network.

      - name: greedy-output-equivalence
        status: implemented
        description: |
          Greedy generation (temperature=0) through the distributed pipeline
          produces the same output as single-node Phase 1 inference.
          Validated: "The capital of France is" → "Paris. The capital of
          France is Paris..." — identical across local and distributed.

      - name: long-generation-stability
        status: not-tested
        description: |
          1000-token generation completes without errors, numerical drift,
          or memory leaks. Validates that KV cache state is maintained
          correctly across many decode steps through the network pipeline.
          Requires dedicated test run with memory monitoring.

      - name: network-failure-detection
        status: not-tested
        description: |
          When a worker becomes unreachable (network interruption or process
          death), the coordinator detects the failure within 15 seconds via
          the heartbeat protocol. Active sequences on the failed worker are
          aborted. Requires simulated network failure test.

      - name: pipeline-setup-latency
        status: implemented
        description: |
          Worker registration, calibration benchmark, layer assignment, and
          pipeline setup complete in under 30 seconds. Validated by
          bench_pipeline_setup_latency (#[ignore] benchmark test) which
          measures the full setup and asserts < 30s. Observed ~2.6s on
          RTX 5090. Run with: cargo nextest run -p fracture-coordinator-cuda
          --run-ignored all -E 'test(bench)'

      - name: concurrent-sequence-distributed
        status: implemented
        description: |
          Multiple simultaneous generation requests are processed correctly
          through the batched distributed pipeline without data corruption,
          deadlock, or incorrect KV cache isolation. Validated by
          test_e2e_distributed_batched_concurrent which sends 3 concurrent
          greedy requests and verifies each matches sequential output.

      - name: distributed-batched-equivalence
        status: implemented
        description: |
          The distributed batched pipeline (--batched flag, using
          distributed_loop.rs and pipeline.batched_forward()) produces
          identical greedy output to the sequential distributed_generate
          path. Validated by test_e2e_distributed_batched_matches_sequential
          which runs both modes on the same prompts and asserts token-level
          equality.

      - name: distributed-batched-throughput
        status: implemented
        description: |
          Throughput benchmark for the batched distributed pipeline under
          concurrent load. bench_distributed_batched_throughput sends N
          concurrent requests and measures total tokens / wall time.
          Reports tokens/second for the distributed batched path.

      - name: http-api-distributed-generation
        status: implemented
        description: |
          An OpenAI-compatible HTTP request (e.g., /v1/completions) submitted
          to the coordinator is routed through the distributed pipeline and
          returns a correct response. Validates end-to-end from HTTP request
          through TCP-based multi-machine inference back to HTTP response.

  # ============================================================
  # PAGED KV CACHE (Phase 4)
  # ============================================================
  - name: Block Pool
    path: crates/fracture-engine/src
    status: implemented
    description: |
      Pre-allocated pool of fixed-size KV cache blocks on GPU memory.
      Each block holds 16 tokens of K and V data per layer. Blocks are
      allocated at startup and managed via a free list.
    shared: [error-handling]
    dismissed:
      - suggestion: block-pool-batch-alloc-rollback
        reason: append_kv allocates blocks one at a time within a loop; partial failure leaves the sequence with its previously-written data and returns error — no orphaned blocks
      - suggestion: block-pool-double-free
        reason: blocks are only freed via PagedKvCacheManager::free() which removes the sequence entry atomically; double-free is prevented at the cache manager level, not the pool level
    behaviors:
      - name: block-pool-alloc-free
        status: implemented
        description: |
          Blocks are allocated from a free list (stack pop) and returned
          on free (stack push). Pool exhaustion returns OutOfMemory error.
          Freed blocks are immediately reusable.

      - name: block-pool-gpu-preallocation
        status: implemented
        description: |
          All GPU memory for the block pool is allocated at startup via
          backend.alloc(). Each block is [16, num_kv_heads, head_dim] FP16
          for both K and V, across all layers. Pool creation failure
          (OOM) is reported as a KvCache error.

      - name: block-pool-capacity
        status: implemented
        description: |
          The pool reports total capacity, free block count, and bytes
          per block. For Llama 3 8B with 32 layers, each block is 2 MB
          (16 tokens × 8 heads × 128 dim × 2 bytes × 2 (K+V) × 32 layers).

  - name: Paged KV Cache Manager
    path: crates/fracture-engine/src
    status: implemented
    description: |
      Per-sequence block table management for paged KV cache. Each sequence
      maintains a list of physical block IDs mapping logical token positions
      to blocks in the pool. Blocks are allocated on demand as tokens are
      appended.
    shared: [error-handling]
    dismissed:
      - suggestion: paged-cache-pool-creation
        reason: covered by block-pool-gpu-preallocation in the Block Pool section
      - suggestion: paged-cache-pool-utilization
        reason: covered by block-pool-capacity in the Block Pool section
    behaviors:
      - name: paged-cache-alloc-free
        status: implemented
        description: |
          Allocating a new sequence reserves one initial block from the pool.
          Freeing a sequence returns all its blocks to the pool's free list.
          Operations on freed handles return errors.

      - name: paged-cache-append
        status: implemented
        description: |
          Appending KV data writes into the current block's remaining slots
          via backend.copy_rows(). When the current block is full, a new
          block is automatically allocated from the pool. Prefill appends
          multiple tokens at once, spanning multiple blocks if needed.
          Layer 0 manages block allocation and metadata; layers 1+ write
          to the same offsets without re-allocating.

      - name: paged-cache-block-table
        status: implemented
        description: |
          Each sequence exposes its block table (list of physical block IDs)
          for the paged attention kernel. Also exposes seq_len (total tokens)
          and last_block_tokens (fill level of final block).

      - name: paged-cache-oom
        status: implemented
        description: |
          When append_kv needs a new block but the pool is exhausted,
          returns OutOfMemory error. The sequence remains valid with its
          previously written data.

      - name: paged-cache-multi-sequence
        status: implemented
        description: |
          Multiple sequences have independent block tables with no
          overlapping block IDs. Freeing one sequence does not affect
          others. Freed blocks are reusable by subsequent allocations.

  - name: Paged Attention Kernel
    path: backends/fracture-cuda
    status: implemented
    description: |
      CUDA kernel for scaled dot-product attention reading KV data from
      a paged block pool instead of contiguous cache arrays. Written from
      scratch (not adapted from vLLM or other implementations).
    shared: [numerical-correctness, error-handling]
    dismissed:
      - suggestion: paged-attention-block-iteration
        reason: implementation detail of internal kernel addressing, not observable input/output; correctness verified by paged-attention-correctness
    behaviors:
      - name: paged-attention-correctness
        status: implemented
        description: |
          Paged attention produces bit-identical output to contiguous
          attention for both prefill and decode. Validated with a random-
          weight model: 5-token prefill and 5 greedy decode steps both
          produce max_diff=0.000000 between paged and contiguous paths.

      - name: paged-attention-multi-block
        status: implemented
        description: |
          Paged attention produces correct output when a sequence spans
          multiple physical blocks, verifying block-boundary crossings.
          Requires a test with > 16 tokens to exercise cross-block reads.

      - name: paged-attention-causal-mask
        status: implemented
        description: |
          Causal masking is applied: query at position (start_pos + q_idx)
          attends only to keys at positions 0..start_pos+q_idx. GQA head
          grouping (num_q_heads / num_kv_heads) is handled identically
          to the contiguous attention kernel.

  - name: Paged Engine Integration
    path: crates/fracture-engine/src
    status: implemented
    description: |
      The engine provides forward_paged() and forward_node_paged() methods
      that use PagedKvCacheManager instead of the contiguous KvCacheManager.
      Both paths coexist via KvCacheBackend enum for A/B validation.
    shared: [error-handling, backend-agnostic]
    behaviors:
      - name: paged-forward-prefill
        status: implemented
        description: |
          forward_paged() processes a prompt through the full transformer
          (embedding, all layers, LM head) using paged KV cache. Each
          layer appends K/V via cache.append_kv() and calls
          backend.attention_paged() with the sequence's block table.

      - name: paged-forward-decode
        status: implemented
        description: |
          Decode steps append a single token's K/V per layer. The block
          table grows automatically when the current block fills. Greedy
          token sequences from paged decode are identical to contiguous.

      - name: kv-cache-backend-enum
        status: implemented
        description: |
          KvCacheBackend enum wraps both Contiguous(KvCacheManager) and
          Paged(PagedKvCacheManager). Provides unified alloc/seq_len/free
          methods. The contiguous path is the default until paged is
          fully validated end-to-end on the production model.

      - name: paged-forward-node
        status: implemented
        description: |
          forward_node_paged() processes activations through an arbitrary
          layer range using paged KV cache, accepting NodeInput and
          returning NodeOutput for pipeline-parallel inference.

      - name: paged-contiguous-equivalence
        status: implemented
        description: |
          Paged and contiguous forward paths produce identical greedy
          token sequences on the same input. Validated with GPU tests:
          prefill and 5 decode steps both produce max_diff=0.000000.

  # ============================================================
  # BATCHED FORWARD PASS (Phase 4)
  # ============================================================
  - name: Batched Forward Pass
    path: crates/fracture-engine/src
    status: implemented
    description: |
      Processes multiple sequences in a single forward pass. Per-token
      operations (matmul, RMSNorm, RoPE, FFN) are concatenated into one
      large tensor for GPU efficiency. Attention is dispatched per-sequence
      since each has its own paged block table.
    shared: [numerical-correctness, error-handling, backend-agnostic]
    behaviors:
      - name: batched-forward-concatenation
        status: implemented
        description: |
          All sequences' tokens are concatenated into a single
          [total_tokens, hidden] tensor for embedding, QKV projection,
          RoPE, output projection, and FFN. Larger batches produce
          larger matmuls for better GPU utilization.

      - name: batched-forward-per-sequence-attention
        status: implemented
        description: |
          Attention is dispatched per-sequence within the batch. Each
          sequence's Q slice is extracted via copy_rows, passed to
          attention_paged with its own block table, and the result is
          copied back into the batched attention output buffer.

      - name: batched-forward-per-sequence-cache-append
        status: implemented
        description: |
          Each sequence's K/V data is sliced from the concatenated
          projection tensors and appended to its own paged cache via
          append_kv. Sequences with different token counts (prefill vs
          decode) are handled correctly within the same batch.

      - name: batched-forward-per-sequence-logits
        status: implemented
        description: |
          After the layer loop, only the last token's logits are
          extracted per sequence (not all tokens). Each sequence gets
          its own logit vector for independent sampling.

      - name: batched-forward-sequential-equivalence
        status: implemented
        description: |
          Running N sequences through batched_forward produces identical
          per-sequence logits to running each sequence individually
          through forward_paged. Validated on GPU: two sequences with
          different prompt lengths, max_diff=0.000000 for both.

      - name: batched-forward-empty-batch
        status: implemented
        description: |
          An empty batch (no sequences) returns an empty BatchedOutput
          without error.

      - name: batched-forward-mixed-lengths
        status: implemented
        description: |
          A batch containing sequences with different token counts
          (e.g., a 5-token prefill and a 1-token decode) processes
          correctly. Each sequence's positions and cache state are
          independent.

  # ============================================================
  # BATCHED FORWARD NODE (Phase 4)
  # ============================================================
  - name: Batched Forward Node
    path: crates/fracture-engine/src
    status: implemented
    description: |
      Pipeline-aware batched forward pass for distributed workers.
      Like batched_forward but handles head/middle/tail node roles:
      head embeds token IDs, middle/tail receive activations, tail
      produces logits, head/middle return activations.
    shared: [numerical-correctness, error-handling, backend-agnostic]
    dismissed:
      - suggestion: batched-node-middle-returns-activations
        reason: middle node is a non-head non-tail node; covered by combination of batched-node-nonhead-requires-activations (input) and the fact that non-tail always returns activations (same code path as head)
    behaviors:
      - name: batched-node-head-returns-activations
        status: implemented
        description: |
          A head node (layer_range starts at 0) embeds token IDs from
          SequenceSlice, runs its layers with paged attention, and
          returns NodeOutput::Activations (not logits). The activation
          tensor has shape [total_tokens, hidden_size].

      - name: batched-node-tail-returns-logits
        status: implemented
        description: |
          A tail node (layer_range ends at total_layers) receives
          activations, runs its layers, applies final RMSNorm + LM head,
          and returns NodeOutput::Logits. Logits are flattened across
          sequences (N * vocab_size f32 values).

      - name: batched-node-full-model
        status: implemented
        description: |
          A node covering all layers (head+tail) produces logits directly
          from token IDs. Equivalent to batched_forward but wrapped in
          NodeOutput for distributed pipeline compatibility.

      - name: batched-node-head-rejects-activations
        status: implemented
        description: |
          A head node given input_hidden_states (activations) returns a
          clear Pipeline error. Head nodes must receive token IDs via
          SequenceSlice::token_ids.

      - name: batched-node-nonhead-requires-activations
        status: implemented
        description: |
          A non-head node called with input_hidden_states=None returns a
          clear Pipeline error. Middle and tail nodes must receive
          activations from the previous pipeline stage.

      - name: batched-node-empty-sequences-rejected
        status: implemented
        description: |
          Calling batched_forward_node with an empty sequence slice
          returns a Pipeline error. At least one sequence is required.

  # ============================================================
  # BATCH SCHEDULER (Phase 4)
  # ============================================================
  - name: Batch Scheduler
    path: crates/fracture-engine/src
    status: implemented
    description: |
      Iteration-level batch scheduler that decides which sequences to
      include in each forward pass. Manages the prefill queue and active
      decode sequences. Runs as a dedicated async loop.
    shared: [error-handling]
    behaviors:
      - name: scheduler-decode-priority
        status: implemented
        description: |
          All active decode sequences are included in every batch before
          any new prefills are admitted. Decodes are cheap (1 token each)
          and latency-sensitive.

      - name: scheduler-prefill-admission
        status: implemented
        description: |
          New requests from the prefill queue are admitted when batch
          capacity (max_batch_tokens, max_batch_size) and memory
          (free blocks in pool) allow. Admission checks block pool
          reserve to prevent starving active decodes.

      - name: scheduler-prefill-chunking
        status: implemented
        description: |
          Prompts longer than max_prefill_tokens (configurable, default
          512) are split into chunks. Each chunk is processed in a
          separate iteration. The sequence accumulates KV cache across
          chunks and enters decode after the final chunk.

      - name: scheduler-batch-construction
        status: implemented
        description: |
          The scheduler builds a SchedulerDecision containing prefill
          and decode jobs. Total tokens across all jobs respects
          max_batch_tokens. The decision is converted to SequenceSlice
          entries for batched_forward.

      - name: scheduler-sequence-completion
        status: implemented
        description: |
          After sampling, sequences that hit a stop token or max_tokens
          are removed from active_sequences. Their cache blocks are
          freed. Their token channel receives GenerationEvent::Finished
          with the stop reason.

      - name: scheduler-block-pool-reserve
        status: implemented
        description: |
          A configurable fraction (default 10%) of the block pool is
          reserved for active sequence growth. New sequences are only
          admitted if free_blocks - needed_blocks > reserved_blocks.

  # ============================================================
  # ASYNC REQUEST HANDLING (Phase 4)
  # ============================================================
  - name: Async Request Handling
    path: crates/fracture-server/src
    status: implemented
    description: |
      HTTP handlers enqueue requests and return immediately with a
      streaming connection. A dedicated scheduler loop processes all
      requests in batches and sends tokens back through channels.
    shared: [error-handling]
    behaviors:
      - name: async-request-enqueue
        status: implemented
        description: |
          The HTTP handler validates the request, tokenizes the prompt,
          creates a token channel, and enqueues an InFlightRequest in
          the prefill queue. It does not block on generation.

      - name: async-streaming-response
        status: implemented
        description: |
          SSE streaming reads from the GenerationEvent channel. Each
          Token event becomes an SSE data chunk. Finished triggers the
          final chunk with finish_reason and usage stats. Error sends
          an error event.

      - name: async-non-streaming-response
        status: implemented
        description: |
          Non-streaming requests use a oneshot channel. The scheduler
          collects all tokens and sends the complete response when the
          sequence finishes. The HTTP handler awaits the oneshot.

      - name: async-cancellation-on-disconnect
        status: implemented
        description: |
          When a client disconnects (token_tx receiver dropped), the
          scheduler detects the closed channel on the next send and
          marks the sequence for cleanup. Cache blocks are freed.

  # ============================================================
  # SCHEDULER LOOP (Phase 4)
  # ============================================================
  - name: Scheduler Loop
    path: crates/fracture-server/src
    status: implemented
    description: |
      Dedicated tokio task that runs the batch scheduler every iteration.
      It is the sole consumer of the inference pipeline — no Mutex on
      the cache or engine.
    shared: [error-handling]
    behaviors:
      - name: scheduler-loop-iteration
        status: implemented
        description: |
          Each iteration: build batch via scheduler, run batched_forward,
          sample per-sequence tokens, send tokens to channels, check
          stop conditions, free completed sequences.

      - name: scheduler-loop-sampling
        status: implemented
        description: |
          After batched_forward returns per-sequence logits, the scheduler
          samples a token for each sequence using its individual
          SamplingParams (temperature, top_k, top_p, seed). Sampling
          runs on CPU (same as Phase 1-3).

      - name: scheduler-loop-token-streaming
        status: implemented
        description: |
          Each sampled token is immediately sent through the sequence's
          token_tx channel as GenerationEvent::Token. Tokens are not
          buffered — they stream to clients as generated.

      - name: scheduler-loop-concurrent-correctness
        status: implemented
        description: |
          Multiple concurrent HTTP requests produce correct, independent
          results. Each sequence's output matches what it would produce
          if run alone.

      - name: scheduler-loop-snapshot
        status: implemented
        description: |
          The scheduler loop accepts Snapshot commands via a oneshot channel
          alongside Submit commands. Snapshots read BatchScheduler and
          PagedKvCacheManager state without blocking the hot path, returning
          a SchedulerSnapshot DTO to the dashboard endpoint.

  # ============================================================
  # DASHBOARD BACKEND (DTOs and Infrastructure)
  # ============================================================
  - name: Dashboard DTOs
    path: crates/fracture-server/src/dashboard
    status: implemented
    description: |
      Serializable response types for all dashboard API endpoints.
      Separate from internal engine types — constructed by handlers
      from mode-specific data sources (standalone vs distributed).
    shared: [error-handling]
    behaviors:
      - name: cluster-response-dto
        status: implemented
        description: |
          ClusterResponse includes mode (standalone/distributed),
          worker list with GPU info, VRAM usage, layer assignments,
          heartbeat status, and model metadata.

      - name: scheduler-response-dto
        status: implemented
        description: |
          SchedulerResponse includes active/max sequences, decode/prefill
          queue counts, KV cache block pool stats (total, allocated, free,
          utilization), and per-sequence state.

      - name: metrics-event-dto
        status: implemented
        description: |
          MetricsEvent for SSE stream includes throughput (tok/s), active
          requests, TTFT, inter-token latency, cache utilization, and
          per-worker heartbeat ages.

      - name: request-record-dto
        status: implemented
        description: |
          RequestRecord captures completed request metadata: type,
          status, token counts, timing (TTFT, total duration, tok/s),
          finish reason, temperature, and creation timestamp.

  - name: Dashboard Metrics Collector
    path: crates/fracture-server/src/dashboard
    status: implemented
    description: |
      Thread-safe metrics aggregator shared between HTTP handlers
      (which record completions) and the SSE endpoint (which reads
      snapshots). Uses Arc<Mutex<Inner>> for safe concurrent access.
    shared: [error-handling]
    behaviors:
      - name: throughput-sliding-window
        status: implemented
        description: |
          Tracks completed tokens in a 10-second sliding window.
          Throughput = total tokens in window / window duration.
          Old entries pruned on each snapshot() call.

      - name: latency-ema
        status: implemented
        description: |
          Exponential moving average (alpha=0.3) for time-to-first-token
          and inter-token latency. Updated on each request completion.
          Zero values used as initial state.

      - name: active-request-tracking
        status: implemented
        description: |
          Incremented on request_started(), decremented on
          record_completion(). Saturating subtraction prevents underflow.

  - name: Dashboard Request Log
    path: crates/fracture-server/src/dashboard
    status: implemented
    description: |
      Bounded FIFO log of completed requests. Newest first.
      Arc-shared for concurrent push (handlers) and read (endpoint).
    shared: [error-handling]
    behaviors:
      - name: bounded-capacity
        status: implemented
        description: |
          VecDeque capped at 1000 entries behind a Mutex.
          push() adds to front, evicts from back when full.

      - name: paginated-read
        status: implemented
        description: |
          page(page, per_page) returns a slice of records with
          total count. Page is 1-indexed, per_page clamped to 1-100.

  # ============================================================
  # DASHBOARD API ENDPOINTS
  # ============================================================
  - name: Dashboard API Endpoints
    path: crates/fracture-server/src/dashboard
    status: implemented
    description: |
      REST and SSE endpoints for the dashboard UI. Registered as a
      sub-router merged into both create_router and create_batched_router.
      CORS permissive layer applied for dev-mode cross-origin requests.
    shared: [error-handling]
    behaviors:
      - name: cluster-endpoint
        status: implemented
        description: |
          GET /v1/cluster returns ClusterResponse. In standalone mode,
          constructs a single worker from backend GPU info. Uses
          ClusterProvider enum for mode-specific data sources.

      - name: scheduler-endpoint
        status: implemented
        description: |
          GET /v1/scheduler returns SchedulerResponse. Uses
          SchedulerHandle::snapshot() oneshot mechanism for batched
          modes. Returns empty response for non-batched standalone.

      - name: metrics-stream-endpoint
        status: implemented
        description: |
          GET /v1/metrics/stream is an SSE endpoint that pushes a
          MetricsEvent every second via tokio::time::interval. Calls
          MetricsCollector::snapshot(). Stream never ends — zero
          values emitted when idle.

      - name: requests-endpoint
        status: implemented
        description: |
          GET /v1/requests returns paginated RequestsResponse.
          Supports ?page=N&per_page=M query parameters via axum
          Query extractor.

      - name: cors-middleware
        status: implemented
        description: |
          CorsLayer::permissive() applied to all routers (create_router,
          create_batched_router, coordinator router) for dashboard
          dev-mode cross-origin access.

      - name: dashboard-route-merging
        status: implemented
        description: |
          dashboard_routes() returns a Router with all dashboard
          endpoints. Merged into existing API routers via Router::merge
          in both standalone and coordinator binaries.

  # ============================================================
  # DASHBOARD FRONTEND
  # ============================================================
  - name: Dashboard Frontend Foundation
    path: fracture-dashboard/src
    status: implemented
    description: |
      React 18 + TypeScript (strict) + Vite + Tailwind CSS frontend.
      Dark theme infrastructure dashboard. Vite dev server proxies
      /v1 and /health to the Rust backend on port 8080.
    behaviors:
      - name: typed-api-client
        status: implemented
        description: |
          Typed fetch wrapper (api/client.ts) for REST endpoints and
          POST-based SSE streaming (api/sse.ts) for chat completions.
          All TypeScript interfaces mirror Rust DTOs.

      - name: mock-data-mode
        status: implemented
        description: |
          VITE_MOCK=true enables mock data generators for all endpoints.
          Dashboard is fully functional without a running backend or GPU.
          Mock data produces realistic-looking values with variation.

      - name: layout-shell-routing
        status: implemented
        description: |
          Shell component with icon sidebar (Cluster, Playground,
          Scheduler) and status bar. React Router v6 with three routes.
          StatusBar polls /health for connection indicator.

      - name: polling-hooks
        status: implemented
        description: |
          useCluster (5s), useScheduler (2s), useRequests (5s) hooks
          with loading/error/data state. useMetricsStream uses native
          EventSource for SSE with 60-event rolling buffer.

  - name: Dashboard Cluster Page
    path: fracture-dashboard/src
    status: implemented
    description: |
      Landing page showing cluster topology, live performance metrics,
      and model information.
    behaviors:
      - name: pipeline-visualization
        status: implemented
        description: |
          PipelineView renders workers as cards arranged horizontally
          with chevron connectors. Handles 1..N workers dynamically.
          WorkerCard shows GPU name, layer range, VRAM bar, heartbeat
          status dot, and calibration speed.

      - name: live-metrics-sparklines
        status: implemented
        description: |
          MetricsSummary displays 4 stat cards (throughput, active
          requests, TTFT, cache utilization) with Recharts sparkline
          graphs over the last 60 seconds of data.

      - name: model-info-display
        status: implemented
        description: |
          ModelInfo card shows model name, parameters, layers, context
          length, and dtype from the cluster endpoint.

  - name: Dashboard Inference Playground
    path: fracture-dashboard/src
    status: implemented
    description: |
      Multi-turn chat interface with real-time token streaming,
      parameter controls, and generation statistics.
    behaviors:
      - name: streaming-chat
        status: implemented
        description: |
          useInference hook manages message state, POST-based SSE
          streaming via fetch ReadableStream, AbortController for
          cancellation, and timing stats (TTFT, tok/s).

      - name: chat-ui
        status: implemented
        description: |
          ChatView with user/assistant message bubbles, textarea
          input (Enter to send, Shift+Enter newline), streaming
          cursor animation, and abort button during generation.

      - name: parameter-controls
        status: implemented
        description: |
          ParamControls with sliders for temperature (0-2, step 0.1)
          and top_p (0-1, step 0.05), number inputs for top_k,
          max_tokens, and seed.

      - name: generation-stats-display
        status: implemented
        description: |
          GenerationStats shows TTFT, tokens/second, completion
          token count, and finish reason in mono font.

  - name: Dashboard Scheduler Page
    path: fracture-dashboard/src
    status: implemented
    description: |
      Scheduler state visualization with queue stats, KV cache
      pool bar, and active sequence table.
    behaviors:
      - name: queue-overview
        status: implemented
        description: |
          QueueOverview shows 3 stat cards: active sequences (N/max),
          decode queue count, prefill queue count with colored accents.

      - name: cache-pool-visualization
        status: implemented
        description: |
          CachePool renders horizontal progress bar with color
          transitions (emerald <60%, amber 60-85%, red >85%).
          Shows allocated/total blocks with percentage and
          tokens-per-block info.

      - name: sequence-table
        status: implemented
        description: |
          SequenceTable with client-side sorting by ID, state,
          tokens generated, max tokens. Colored state badges
          (blue=prefilling, green=decoding, gray=completed).
          Auto-refreshes via useScheduler 2s polling.
