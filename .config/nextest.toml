[test-groups.gpu-memory-sensitive]
# Tests that need exclusive GPU access: model-validation tests load the full
# 15GB Llama 3.1 8B model, and memory-measurement tests need a stable baseline.
# Running any of these concurrently with other GPU-heavy tests causes OOM.
max-threads = 1

[[profile.default.overrides]]
filter = 'package(fracture-model-validation)'
test-group = 'gpu-memory-sensitive'

[[profile.default.overrides]]
filter = 'test(test_gpu_cache_freed_after_generation) | test(/test_matmul_(prefill_correctness|llama3_ffn_shapes|large_prefill|llama3_vocab_projection|llama3_prefill_ffn)/)'
test-group = 'gpu-memory-sensitive'

[[profile.default.overrides]]
filter = 'binary(golden) and package(fracture-server-cuda)'
test-group = 'gpu-memory-sensitive'

[test-groups.e2e-distributed]
# E2E tests spawn coordinator + worker processes that each load the full model.
# Must run one at a time to avoid GPU OOM and port conflicts.
max-threads = 1

[[profile.default.overrides]]
filter = 'package(fracture-coordinator-cuda)'
test-group = 'e2e-distributed'
