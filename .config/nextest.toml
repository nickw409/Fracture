[test-groups.model-validation]
# Model validation tests each load the full 15GB Llama 3.1 8B model onto the GPU.
# Running more than one in parallel causes OOM on most GPUs.
max-threads = 1

[test-groups.gpu-memory-sensitive]
# The cache-freed-after-generation test measures available_memory() and is
# sensitive to other GPU-heavy tests running concurrently. Only this test
# and the large matmul tests that could shift the memory baseline need
# serialization.
max-threads = 1

[[profile.default.overrides]]
filter = 'package(fracture-model-validation)'
test-group = 'model-validation'

[[profile.default.overrides]]
filter = 'test(test_gpu_cache_freed_after_generation) | test(/test_matmul_(prefill_correctness|llama3_ffn_shapes|large_prefill)/)'
test-group = 'gpu-memory-sensitive'

[test-groups.e2e-distributed]
# E2E tests spawn coordinator + worker processes that each load the full model.
# Must run one at a time to avoid GPU OOM and port conflicts.
max-threads = 1

[[profile.default.overrides]]
filter = 'test(/test_e2e_/)'
test-group = 'e2e-distributed'
